<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求职工具箱 · CareerKit — 安静、专业、有用</title>
<meta name="description" content="一套安静但专业的求职工具：简历 ATS 检测、求职追踪、面试训练、薪资参考、公司背调。所有计算在本地完成，不存储你的数据。">
<style>
/* =========================================================
   求职工具箱 CareerKit — 高级感设计系统
   灵感：Linear / Figma / Vercel / 无印良品
   ========================================================= */

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  /* 背景与表面 */
  --bg:         #F8F7F4;
  --bg-elev:    #FFFFFF;
  --bg-subtle:  #F0EEEA;

  /* 文字 */
  --text:       #1A1A1A;
  --text-dim:   #4A4A4A;
  --text-faint: #8A8A8A;
  --text-line:  #E5E3DF;

  /* 主色 — 克制的蓝绿色 */
  --accent:     #2D6A4F;
  --accent-soft:#E8F0EC;

  /* 状态色 — 低饱和 */
  --ok:         #2D6A4F;
  --warn:       #B8860B;
  --bad:        #B23A48;
  --info:       #3D5A80;

  /* 排版 */
  --font-display: 'Fraunces', 'Times New Roman', 'Songti SC', serif;
  --font-body:    'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono:    'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* 圆角 */
  --r-sm:  6px;
  --r-md:  10px;
  --r-lg:  16px;

  /* 阴影 — 非常柔和 */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg: 0 16px 48px rgba(0,0,0,0.08);

  /* 过渡 */
  --ease: cubic-bezier(.2,.8,.2,1);
}

html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* —— 顶部导航 —— */
.topbar {
  position: sticky; top:0; z-index:50;
  background: rgba(248,247,244,0.8);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--text-line);
}
.topbar-inner {
  max-width: 1160px;
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  display: flex; align-items: baseline; gap: 10px;
  text-decoration: none; color: var(--text);
}
.brand-logo {
  width: 28px; height: 28px;
  background: var(--text);
  border-radius: 6px;
  position: relative;
}
.brand-logo::after {
  content: ''; position: absolute;
  left: 7px; top: 7px; width: 14px; height: 14px;
  background: var(--bg); border-radius: 3px;
}
.brand-name {
  font-family: var(--font-display);
  font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
}
.brand-sub { font-size: 12px; color: var(--text-faint); }
.top-links { display: flex; gap: 24px; font-size: 13px; color: var(--text-dim); }
.top-links a { color: inherit; text-decoration: none; }
.top-links a:hover { color: var(--text); }

/* —— Hero —— */
.hero {
  max-width: 1160px; margin: 0 auto;
  padding: 96px 24px 72px;
  text-align: center;
  position: relative;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(45,106,79,0.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(61,90,128,0.05) 0%, transparent 50%);
  pointer-events: none;
}
.hero-tag {
  display: inline-block;
  font-size: 12px; color: var(--text-dim);
  padding: 5px 14px;
  border: 1px solid var(--text-line);
  border-radius: 100px;
  margin-bottom: 28px;
  letter-spacing: 0.04em;
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(36px, 6vw, 64px);
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin-bottom: 20px;
  color: var(--text);
}
.hero-title em {
  font-style: italic;
  color: var(--accent);
}
.hero-lead {
  font-size: 17px;
  color: var(--text-dim);
  max-width: 540px;
  margin: 0 auto 40px;
}
.hero-meta {
  display: flex; justify-content: center; gap: 40px; flex-wrap: wrap;
  padding-top: 32px;
  border-top: 1px solid var(--text-line);
  max-width: 480px; margin: 0 auto;
}
.hero-meta strong {
  font-family: var(--font-display);
  font-size: 28px; font-weight: 600; color: var(--text);
  display: block;
}
.hero-meta span { font-size: 12px; color: var(--text-faint); }

/* —— 分类 —— */
.section { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 28px;
}
.section-title {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 600;
  letter-spacing: -0.01em;
}
.section-title small { font-family: var(--font-body); font-size: 13px; font-weight: 400; color: var(--text-faint); margin-left: 10px; }

.categories {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 6px; background: var(--bg-subtle);
  border-radius: 12px;
  width: fit-content;
  margin-bottom: 32px;
}
.cat-pill {
  padding: 7px 18px;
  font-size: 13px; font-weight: 500;
  background: transparent; border: none; border-radius: 8px;
  color: var(--text-dim); cursor: pointer;
  transition: all .2s var(--ease);
  font-family: var(--font-body);
}
.cat-pill:hover { color: var(--text); }
.cat-pill.active {
  background: var(--bg-elev);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

/* —— 工具卡片 —— */
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}
.tool-card {
  background: var(--bg-elev);
  border: 1px solid var(--text-line);
  border-radius: var(--r-lg);
  padding: 28px;
  cursor: pointer;
  transition: all .25s var(--ease);
  position: relative;
  display: flex; flex-direction: column;
}
.tool-card:hover {
  transform: translateY(-2px);
  border-color: #D8D6D2;
  box-shadow: var(--shadow-md);
}
.tc-top {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 14px;
}
.tc-icon {
  width: 40px; height: 40px;
  background: var(--accent-soft);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.tc-title { font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
.tc-badge {
  margin-left: auto;
  font-size: 11px; padding: 3px 9px;
  background: var(--bg-subtle); color: var(--text-dim);
  border-radius: 6px;
  font-weight: 500; letter-spacing: 0.03em;
  text-transform: uppercase;
}
.tc-badge.hot { background: #FDF0EF; color: var(--bad); }
.tc-desc {
  font-size: 13.5px; color: var(--text-dim);
  line-height: 1.55;
  flex: 1;
}
.tc-footer {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--text-line);
  font-size: 12px; color: var(--text-faint);
  display: flex; align-items: center; justify-content: space-between;
}
.tc-arrow { transition: transform .2s var(--ease); }
.tool-card:hover .tc-arrow { transform: translateX(3px); }

/* —— Modal —— */
.modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(26,26,26,0.35);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  padding: 24px;
  animation: fadeIn .2s var(--ease);
}
.modal-mask.active { display: flex; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:translateY(0)} }

.modal {
  background: var(--bg-elev);
  border-radius: var(--r-lg);
  width: 100%; max-width: 680px;
  max-height: 86vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp .25s var(--ease);
}
.modal-head {
  padding: 22px 28px;
  border-bottom: 1px solid var(--text-line);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--bg-elev); z-index: 1;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
}
.modal-head h2 {
  font-family: var(--font-display);
  font-size: 19px; font-weight: 600; letter-spacing: -0.01em;
}
.close {
  width: 32px; height: 32px;
  border: 1px solid var(--text-line);
  background: var(--bg-elev);
  border-radius: 8px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); font-size: 15px;
  transition: all .15s var(--ease);
}
.close:hover { background: var(--bg-subtle); color: var(--text); }
.modal-body { padding: 28px; }

/* —— 表单 —— */
label { display:block; font-size:13px; font-weight:500; color:var(--text-dim); margin-bottom:7px; }
textarea, input[type=text], input[type=number], select {
  width: 100%;
  padding: 11px 14px;
  font-family: var(--font-body);
  font-size: 14px;
  background: var(--bg-elev);
  border: 1px solid var(--text-line);
  border-radius: var(--r-sm);
  color: var(--text);
  transition: all .15s var(--ease);
}
textarea {
  font-family: var(--font-mono);
  font-size: 13px; line-height: 1.6;
  min-height: 160px; resize: vertical;
}
textarea:focus, input:focus, select:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(45,106,79,0.1);
}
.row { display:flex; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.col { flex:1; min-width:130px; }

/* —— 按钮 —— */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px;
  font-size: 13.5px; font-weight: 600;
  font-family: var(--font-body);
  background: var(--text); color: var(--bg);
  border: none; border-radius: var(--r-sm);
  cursor: pointer;
  transition: all .15s var(--ease);
}
.btn:hover { background: #333; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.ghost {
  background: transparent; color: var(--text);
  border: 1px solid var(--text-line);
}
.btn.ghost:hover { background: var(--bg-subtle); color: var(--text); }
.btn.ghost-danger { color: var(--bad); border-color: #E8D5D8; }
.btn.ghost-danger:hover { background: #FDF0EF; }
.btn-sm { padding: 6px 14px; font-size: 12.5px; }

/* —— 输出区 —— */
.output {
  background: var(--bg);
  border: 1px solid var(--text-line);
  border-radius: var(--r-md);
  padding: 18px 20px;
  margin-top: 16px;
  font-family: var(--font-mono);
  font-size: 13px; line-height: 1.7;
  white-space: pre-wrap; word-break: break-word;
  max-height: 380px; overflow-y: auto;
  color: var(--text-dim);
}

/* —— 简历体检 2.0 —— */
.opt-note { margin: 12px 0 0; font-size: 12px; color: var(--text-faint); line-height: 1.7; }
.opt-upload { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 1px dashed var(--text-line); border-radius: 10px; background: var(--bg-subtle); cursor: pointer; transition: border-color .18s, background .18s; margin: 4px 0 12px; }
.opt-upload:hover, .opt-upload.drag { border-color: var(--accent); background: var(--accent-soft); }
.opt-upload-icon { flex: 0 0 auto; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--text-line); background: #fff; color: var(--text); }
.opt-upload-icon svg { width: 19px; height: 19px; }
.opt-upload-text { flex: 1; min-width: 0; }
.opt-upload-text b { display: block; font-size: 13px; font-weight: 600; }
.opt-upload-text span { display: block; margin-top: 2px; font-size: 11.5px; color: var(--text-faint); line-height: 1.5; }
.opt-pick { flex: 0 0 auto; border: 1px solid var(--text-line); background: #fff; color: var(--text); border-radius: 7px; padding: 7px 12px; font: inherit; font-size: 12px; cursor: pointer; }
.opt-pick:hover { border-color: var(--text); }
.opt-upload-status { margin: -4px 0 12px; font-size: 12px; line-height: 1.7; color: var(--text-dim); }
.opt-upload-status.err { color: var(--bad); }
.opt-upload-status.ok { color: var(--ok); }
.opt-progress { height: 4px; border-radius: 999px; background: rgba(0, 0, 0, .08); overflow: hidden; margin-top: 6px; }
.opt-progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.opt-file-note { margin: -4px 0 12px; font-size: 11.5px; color: var(--text-faint); line-height: 1.6; }
@media (max-width: 560px) { .opt-upload { align-items: flex-start; flex-wrap: wrap; } .opt-pick { margin-left: 50px; } }
.opt-jd { min-height: 96px; }
.opt-resume { min-height: 220px; }
.opt-verdict { display: flex; align-items: center; gap: 20px; margin-top: 18px; padding: 20px; border: 1px solid var(--text-line); border-radius: var(--r-md); background: var(--bg-subtle); flex-wrap: wrap; }
.opt-verdict.ok { border-color: #D4E4DB; background: var(--accent-soft); }
.opt-verdict.warn { border-color: #EADFC8; background: #FBF7EE; }
.opt-verdict.bad { border-color: #E8D5D8; background: #FDF0EF; }
.opt-score { display: flex; align-items: baseline; gap: 4px; min-width: 92px; }
.opt-score b { font: 600 44px/1 var(--font-mono); letter-spacing: -.04em; }
.opt-score span { font-size: 12px; color: var(--text-faint); }
.opt-verdict-main { flex: 1; min-width: 220px; }
.opt-verdict-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.opt-verdict-sub { font-size: 12.5px; color: var(--text-dim); line-height: 1.7; }
.opt-sec { margin-top: 26px; }
.opt-detail-head { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--text-line); font-size: 10.5px; font-weight: 700; letter-spacing: .18em; color: var(--text-faint); }
.opt-sec h4 { margin: 0 0 10px; font-size: 14px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.opt-sec-sub { font-size: 11.5px; font-weight: 400; color: var(--text-faint); }
.opt-veto-sum { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.opt-veto-row { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--text-line); }
.opt-veto-row:last-child { border-bottom: 0; }
.opt-veto-main { flex: 1; min-width: 0; font-size: 13px; line-height: 1.65; }
.opt-veto-main b { font-weight: 600; }
.opt-veto-main span { display: block; margin-top: 3px; color: var(--text-faint); font-size: 12px; }
.opt-veto-fix { color: var(--bad); }
.opt-veto-main .opt-veto-fix { color: var(--bad); }
.opt-pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.opt-pill.ok { color: var(--ok); background: var(--accent-soft); }
.opt-pill.warn { color: var(--warn); background: #FBF3E3; }
.opt-pill.bad { color: var(--bad); background: #FDF0EF; }
.opt-seg { display: flex; border: 1px solid var(--text-line); border-radius: 7px; overflow: hidden; flex: 0 0 auto; }
.opt-seg button { border: 0; background: transparent; padding: 5px 9px; font: inherit; font-size: 11.5px; color: var(--text-faint); cursor: pointer; }
.opt-seg button + button { border-left: 1px solid var(--text-line); }
.opt-seg button.on.ok { background: var(--accent-soft); color: var(--ok); font-weight: 600; }
.opt-seg button.on.bad { background: #FDF0EF; color: var(--bad); font-weight: 600; }
.opt-link { margin-top: 10px; border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; }
.opt-dim { padding: 14px 0; border-bottom: 1px solid var(--text-line); }
.opt-dim:last-child { border-bottom: 0; }
.opt-dim-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.opt-dim-head b { font-size: 13.5px; }
.opt-dim-head em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--text-faint); }
.opt-dim ul { margin: 4px 0 0; padding-left: 16px; color: var(--text-dim); font-size: 12.5px; line-height: 1.75; }
.opt-dim-problem { margin-top: 5px; font-size: 12px; color: var(--bad); line-height: 1.65; }
.opt-issue { display: flex; gap: 10px; padding: 11px 14px; border-radius: 8px; background: var(--bg-subtle); margin-bottom: 8px; }
.opt-issue-main { flex: 1; min-width: 0; }
.opt-issue-main b { font-size: 13px; }
.opt-issue-main p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-dim); line-height: 1.65; }
.opt-reason { margin: 3px 0 0; font-size: 12.5px; color: var(--text-dim); line-height: 1.7; }
.opt-reason em { display: inline-block; margin-right: 5px; padding: 1px 6px; border-radius: 4px; background: #E9EDF2; color: #4B5563; font-style: normal; font-size: 11px; font-weight: 700; vertical-align: 1px; }
.opt-fix { margin-top: 5px; font-size: 12px; color: var(--ok); line-height: 1.65; }
.opt-success { padding: 14px 16px; border-radius: 8px; background: var(--accent-soft); color: var(--ok); font-size: 13px; }
.opt-expr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; font-size: 12.5px; }
.opt-expr div { padding: 9px 12px; border-radius: 7px; line-height: 1.65; }
.opt-expr .old { background: #FDF0EF; color: var(--bad); }
.opt-expr .new { background: var(--accent-soft); color: var(--ok); }
.opt-role-tip { margin: 0; padding: 12px 14px; border-radius: 8px; background: var(--bg-subtle); font-size: 12.5px; line-height: 1.8; color: var(--text-dim); }
.opt-more { margin-top: 24px; border-top: 1px solid var(--text-line); padding-top: 14px; }
.opt-more summary { cursor: pointer; font-size: 13px; font-weight: 600; }
.opt-check-list { margin-top: 10px; font-size: 12.5px; color: var(--text-dim); line-height: 1.9; }
.opt-check-list div::before { content: "□ "; color: var(--text-faint); }
@media (max-width: 560px) {
  .opt-expr { grid-template-columns: 1fr; }
  .opt-verdict { padding: 16px; }
  .opt-score b { font-size: 36px; }
}

/* —— ATS 仪表盘 —— */
.ats-score-wrap {
  display: flex; align-items: center; justify-content: center; gap: 48px;
  padding: 32px 24px;
  background: var(--bg);
  border: 1px solid var(--text-line);
  border-radius: var(--r-lg);
  margin: 20px 0;
}
.ats-ring { position: relative; width: 140px; height: 140px; }
.ats-ring svg { transform: rotate(-90deg); }
.ats-ring-bg { fill: none; stroke: var(--text-line); stroke-width: 10; }
.ats-ring-fg { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .8s var(--ease); }
.ats-ring-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ats-num {
  font-family: var(--font-display);
  font-size: 44px; font-weight: 600;
  letter-spacing: -0.02em;
}
.ats-label { font-size: 11px; color: var(--text-faint); letter-spacing: 0.05em; text-transform: uppercase; }
.ats-meta { font-size: 13px; color: var(--text-dim); line-height: 2; }
.ats-meta b { color: var(--text); font-weight: 600; }

/* —— 关键词 —— */
.kw-group { margin: 20px 0; }
.kw-group h4 {
  font-size: 13px; font-weight: 600; color: var(--text-dim);
  margin-bottom: 10px;
}
.kw-list { display: flex; flex-wrap: wrap; gap: 8px; }
.kw-chip {
  padding: 5px 12px; border-radius: 100px;
  font-size: 12.5px; font-weight: 500;
  border: 1px solid transparent;
}
.kw-chip.ok { background: var(--accent-soft); color: var(--ok); border-color: #D4E4DB; }
.kw-chip.bad { background: #FDF0EF; color: var(--bad); border-color: #E8D5D8; }
.kw-chip.info { background: #EEF1F6; color: var(--info); border-color: #D8DEE8; }

/* —— 追踪表格 —— */
.summary-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.summary-card {
  flex: 1; min-width: 110px;
  background: var(--bg-elev); border: 1px solid var(--text-line);
  border-radius: var(--r-md);
  padding: 16px; text-align: center;
}
.summary-card .num {
  font-family: var(--font-display); font-size: 28px; font-weight: 600;
  color: var(--text); line-height: 1;
}

<script>
/* =========================================================

const CATS = [

const TOOLS = [
  { id:'ats',     cat:'resume',    icon:'🎯', title:'ATS 匹配度检测',     desc:'你的简历在 JD 关键词上命中了多少？量化出来。',                  hot:true, fn:toolATS },

  { id:'intro',   cat:'interview', icon:'💬', title:'自我介绍润色',       desc:'30 秒 / 2 分钟 / 5 分钟三档。STAR 框架引导。',                           fn:toolIntro },

  { id:'salary',  cat:'research',  icon:'💰', title:'薪资参考',           desc:'九大城市 · 互联网行业薪资范围表。',                                      fn:toolSalary },
  { id:'cover',   cat:'docs',      icon:'✉️', title:'求职信生成',         desc:'结构化生成。记得替换[括号里]的内容。',                                  fn:toolCover },
  { id:'refer',   cat:'docs',      icon:'🔗', title:'内推话术模板',       desc:'三种场景，复制就能发。',                                                fn:toolRefer },

/* ---------- 初始化 ---------- */
document.addEventListener('DOMContentLoaded', () => {

function render(cat) {
  const list = cat === 'all' ? TOOLS : TOOLS.filter(t => t.cat === cat);
  document.getElementById('grid').innerHTML = list.map(t => `
    <div class="tool-card" onclick="openTool('${t.id}')">

}

function openTool(id) {

  const body = document.getElementById('mbody');

}
function closeModal() { document.getElementById('mask').classList.remove('active'); }

function toast(msg='已复制') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function cp(text) { navigator.clipboard.writeText(text).then(() => toast()); }

/* =========================================================
   通用：简历文件上传与解析（全部在本机完成）
   ========================================================= */
const UPLOAD_ACCEPT = '.pdf,.docx,.doc,.xlsx,.xls,.pptx,.ppt,.txt,.md,.csv,.png,.jpg,.jpeg,.webp,.bmp';

function uploadBoxHtml(prefix) {
  return `
    <div class="opt-upload" id="${prefix}-drop" role="button" tabindex="0" aria-label="上传简历文件">
      <input type="file" id="${prefix}-file" accept="${UPLOAD_ACCEPT}" multiple hidden>
      <span class="opt-upload-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></span>
      <span class="opt-upload-text"><b>上传简历文件</b><span>PDF / Word(.docx) / Excel / PPT(.pptx) / 图片，自动读取文字</span></span>
      <button type="button" class="opt-pick" id="${prefix}-pick">选择文件</button>
    </div>
    <div class="opt-upload-status" id="${prefix}-file-status" hidden><span id="${prefix}-file-msg"></span><div class="opt-progress" id="${prefix}-progress" hidden><i></i></div></div>
  `;
}

var LIB_CFG = {
  pdfjs: {
    srcs: [
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
      'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js',
    ],
    check: function () { return !!window.pdfjsLib; },
    after: function () { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; },
  },
  mammoth: {
    srcs: [
      'https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js',
      'https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js',
    ],
    check: function () { return !!window.mammoth; },
  },
  xlsx: {
    srcs: [
      'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
    ],
    check: function () { return !!window.XLSX; },
  },
  jszip: {
    srcs: [
      'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
      'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js',
    ],
    check: function () { return !!window.JSZip; },
  },
  tesseract: {
    srcs: [
      'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js',
      'https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js',
    ],
    check: function () { return !!window.Tesseract; },
  },
};
var LIB_PROMISES = {};

function loadScript(key) {
  if (LIB_PROMISES[key]) return LIB_PROMISES[key];
  var cfg = LIB_CFG[key];
  if (!cfg) return Promise.reject(new Error('未知解析库'));
  if (cfg.check()) { if (cfg.after) cfg.after(); return Promise.resolve(); }

  var p = new Promise(function (resolve, reject) {
    var srcs = cfg.srcs || [cfg.src];
    var idx = 0;
    function tryNext() {
      if (cfg.check()) { if (cfg.after) cfg.after(); resolve(); return; }
      if (idx >= srcs.length) { reject(new Error('无法加载解析库，请检查网络')); return; }
      var s = document.createElement('script');
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        idx++;
        tryNext();
      }, 10000);
      s.src = srcs[idx];
      s.async = true;
      s.onload = function () {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (!cfg.check()) { idx++; tryNext(); return; }
        if (cfg.after) cfg.after();
        resolve();
      };
      s.onerror = function () {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        idx++;
        tryNext();
      };
      document.head.appendChild(s);
    }
    tryNext();
  });
  LIB_PROMISES[key] = p;
  p.catch(function () { delete LIB_PROMISES[key]; });
  return p;
}

function setUploadStatus(prefix, msg, tone, progress) {
  var box = document.getElementById(prefix + '-file-status');
  var text = document.getElementById(prefix + '-file-msg');
  var bar = document.getElementById(prefix + '-progress');
  if (!box || !text) return;
  box.hidden = false;
  box.className = 'opt-upload-status' + (tone ? ' ' + tone : '');
  text.textContent = msg;
  if (bar) {
    var show = typeof progress === 'number' && progress > 0 && progress < 1;
    bar.hidden = !show;
    if (show) bar.firstElementChild.style.width = Math.round(progress * 100) + '%';
  }
}

function decodeXml(s) {
  return String(s).replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, function (_, n) {
      return String.fromCharCode(parseInt(n, 10));
    });
}
function extOf(name) {
  var m = /\.([^.]+)$/.exec(String(name || ''));
  return m ? m[1].toLowerCase() : '';
}

async function readPdf(file, onProgress) {
  await loadScript('pdfjs');
  var buf = await file.arrayBuffer();
  var doc = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  var pages = [];
  for (var i = 1; i <= doc.numPages; i++) {
    if (onProgress) onProgress(i / Math.max(doc.numPages, 1), '读取 PDF ' + i + ' / ' + doc.numPages + ' 页');
    var page = await doc.getPage(i);
    var content = await page.getTextContent();
    var line = '';
    content.items.forEach(function (it) {
      line += it.str || '';
      line += it.hasEOL ? '\n' : ' ';
    });
    pages.push(line);
  }
  var text = pages.join('\n');
  if (!text.trim()) throw new Error('PDF 中没有可提取文字，可能是扫描件；请上传图片做 OCR 或直接粘贴文本');
  if (/\uFFFD/.test(text)) text += '\n（提示：PDF 字体缺少编码信息，部分文字可能不准确）';
  return text;
}

async function readDocx(file) {
  await loadScript('mammoth');
  var buf = await file.arrayBuffer();
  var res = await window.mammoth.extractRawText({ arrayBuffer: buf });
  return res && res.value ? res.value : '';
}

async function readXlsx(file) {
  await loadScript('xlsx');
  var buf = await file.arrayBuffer();
  var wb = window.XLSX.read(new Uint8Array(buf), { type: 'array' });
  if (!wb.SheetNames || !wb.SheetNames.length) throw new Error('Excel 中没有工作表');
  return wb.SheetNames.map(function (name) {
    var csv = window.XLSX.utils.sheet_to_csv(wb.Sheets[name], { blankrows: false });
    return '【' + name + '】\n' + csv;
  }).join('\n\n');
}

async function readPptx(file, onProgress) {
  await loadScript('jszip');
  var buf = await file.arrayBuffer();
  var zip = await window.JSZip.loadAsync(buf);
  var names = Object.keys(zip.files).filter(function (n) { return /^ppt\/slides\/slide\d+\.xml$/.test(n); })
    .sort(function (a, b) {
      return parseInt((a.match(/(\d+)/) || [0, 0])[1], 10) - parseInt((b.match(/(\d+)/) || [0, 0])[1], 10);
    });
  if (!names.length) throw new Error('PPT 中没有可读取的幻灯片');
  var out = [];
  for (var i = 0; i < names.length; i++) {
    if (onProgress) onProgress((i + 1) / names.length, '读取 PPT ' + (i + 1) + ' / ' + names.length + ' 页');
    var xml = await zip.file(names[i]).async('string');
    var texts = [];
    xml.replace(/<a:t>([\s\S]*?)<\/a:t>/g, function (_, t) { texts.push(decodeXml(t)); return ''; });
    out.push('【第 ' + (i + 1) + ' 页】\n' + texts.join(' '));
  }
  return out.join('\n\n');
}

async function readImage(file, onProgress) {
  await loadScript('tesseract');
  var labels = {
    'loading tesseract core': '加载 OCR 引擎…',
    'initializing tesseract': '初始化 OCR…',
    'loading language traineddata': '加载中文语言包（首次约 15MB）…',
    'initializing api': '准备识别…',
    'recognizing text': 'OCR 识别中',
  };
  var res = await window.Tesseract.recognize(file, 'chi_sim+eng', {
    logger: function (m) {
      var label = labels[m.status] || 'OCR 处理中…';
      var p = m.status === 'recognizing text' ? (m.progress || 0) : 0;
      if (onProgress) onProgress(p, label + (p ? ' ' + Math.round(p * 100) + '%' : ''));
    },
  });
  var text = res && res.data && res.data.text ? res.data.text : '';
  // OCR 常在汉字之间插空格，合并后再交给分块与关键词匹配
  return text.replace(/([\u4e00-\u9fa5])\s+(?=[\u4e00-\u9fa5])/g, '$1');
}

async function readFileText(file, onProgress) {
  var ext = extOf(file.name);
  var type = (file.type || '').toLowerCase();
  if (!ext) {
    if (type.indexOf('pdf') >= 0) ext = 'pdf';
    else if (type.indexOf('wordprocessingml') >= 0) ext = 'docx';
    else if (type.indexOf('spreadsheetml') >= 0) ext = 'xlsx';
    else if (type.indexOf('presentationml') >= 0) ext = 'pptx';
    else if (type.indexOf('image/') === 0) ext = 'png';
  }
  if (['txt', 'md', 'csv', 'json'].indexOf(ext) >= 0) return file.text();
  if (ext === 'pdf') return readPdf(file, onProgress);
  if (ext === 'docx') return readDocx(file);
  if (ext === 'doc') throw new Error('旧版 .doc 暂不支持，请另存为 .docx 或 PDF');
  if (ext === 'xlsx' || ext === 'xls') return readXlsx(file);
  if (ext === 'pptx') return readPptx(file, onProgress);
  if (ext === 'ppt') throw new Error('旧版 .ppt 暂不支持，请另存为 .pptx 或 PDF');
  if (['png', 'jpg', 'jpeg', 'webp', 'bmp'].indexOf(ext) >= 0) return readImage(file, onProgress);
  throw new Error('暂不支持 .' + ext + '，请上传 PDF / Word(.docx) / Excel / PPT(.pptx) / 图片');
}

async function handleResumeFiles(prefix, targetId, fileList) {
  var files = Array.prototype.slice.call(fileList || []);
  if (!files.length) return;
  var chunks = [], errors = [], chars = 0;
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    if (f.size > 30 * 1024 * 1024) { errors.push(f.name + ' 超过 30MB'); continue; }
    setUploadStatus(prefix, '正在读取 ' + f.name + ' …', '', 0.01);
    try {
      var text = await readFileText(f, function (p, label) {
        setUploadStatus(prefix, label || ('正在读取 ' + f.name), '', p);
      });
      text = String(text || '').trim();
      if (!text) { errors.push(f.name + ' 未读取到文字（可能是扫描件）'); continue; }
      chunks.push(text);
      chars += text.replace(/\s/g, '').length;
    } catch (err) {
      errors.push(f.name + '：' + (err && err.message ? err.message : '读取失败'));
    }
  }
  if (chunks.length) {
    var ta = document.getElementById(targetId);
    if (!ta) return;
    ta.value = chunks.join('\n\n');
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    setUploadStatus(prefix, '已读取 ' + chunks.length + ' 个文件，共 ' + chars + ' 字' + (errors.length ? '；' + errors.join('；') : '') + '。可继续补充或开始检测。', errors.length ? '' : 'ok');
  } else {
    setUploadStatus(prefix, errors.join('；') || '未读取到内容', 'err');
  }
}

function mountUpload(prefix, targetId) {
  var drop = document.getElementById(prefix + '-drop');
  var input = document.getElementById(prefix + '-file');
  var pick = document.getElementById(prefix + '-pick');
  if (!drop || !input || !pick) return;
  function open() { input.click(); }
  drop.addEventListener('click', function (e) {
    if (e.target && e.target.closest && e.target.closest('.opt-pick')) return;
    open();
  });
  drop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
  pick.addEventListener('click', function (e) { e.stopPropagation(); open(); });
  input.addEventListener('change', function () {
    handleResumeFiles(prefix, targetId, input.files).finally(function () { input.value = ''; });
  });
  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); e.stopPropagation(); drop.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); e.stopPropagation(); drop.classList.remove('drag'); });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files) handleResumeFiles(prefix, targetId, e.dataTransfer.files);
  });
}

function runATSAlgorithm(resumeRaw, jdRaw) {

    ['spring boot',1.2],['spring',1.0],['django',1.0],['flask',1.0],['express',1.0],['nest.js',1.2],
    ['fastapi',1.2],['gin',1.2],['grpc',1.2],['graphql',1.0],['rest',0.7],['restful',0.7],
    // 存储
    ['mysql',1.0],['postgresql',1.2],['postgres',1.0],['mongodb',1.0],['redis',1.0],['elasticsearch',1.2],
    ['clickhouse',1.2],['dynamodb',1.2],['oracle',0.8],['sqlite',0.7],
    // 云 / 运维
    ['aws',1.0],['azure',1.0],['gcp',1.0],['docker',1.0],['kubernetes',1.2],['k8s',1.2],
    ['jenkins',1.0],['gitlab ci',1.2],['github actions',1.2],['ci/cd',1.0],['terraform',1.2],['linux',0.8],['nginx',1.0],
    // 数据 / AI
    ['sql',1.0],['spark',1.2],['hadoop',1.2],['flink',1.2],['airflow',1.2],['kafka',1.2],
    ['pytorch',1.2],['tensorflow',1.2],['llm',1.2],['gpt',1.0],['bert',1.0],['nlp',1.0],['opencv',1.0],
    ['机器学习',1.2],['深度学习',1.2],['大模型',1.2],['计算机视觉',1.2],['自然语言处理',1.2],
    // 产品 / 运营
    ['产品',0.8],['产品经理',1.0],['用户调研',1.0],['a/b测试',1.0],['数据分析',1.0],['数据驱动',1.0],
    ['增长',0.8],['漏斗',0.8],['留存',0.8],['埋点',1.0],['prd',1.0],['竞品分析',1.0],
    // 工程化加分
    ['微前端',1.2],['qiankun',1.2],['module federation',1.5],['monorepo',1.2],['pnpm',1.2],['eslint',1.0],
    ['单元测试',1.0],['jest',1.0],['vitest',1.0],['cypress',1.0],
    // 软技能（低分权重）
    ['沟通',0.4],['团队协作',0.4],['项目管理',0.5],['敏捷',0.5],['scrum',0.5],
    ['解决问题',0.4],['抗压',0.3],['学习能力',0.3],['领导力',0.4],
  ];

  const UNIT = /\b(a|an|the|的|了|和|是|在|对|及|或|与|等|需要|要求|能够|具备|良好|优秀|熟悉|了解|掌握|熟练|优先|以及|相关|具备|作为|参与|负责|推动|设计|开发|优化|实现|使用)\b/g;

  /* ---- 同义词归并：建立 alias → canonical 映射 ---- */
  const aliasToCanonical = {};
  Object.entries(ATS_THESAURUS).forEach(([canon, aliases]) => {
    aliases.forEach(a => { aliasToCanonical[a.toLowerCase()] = canon.toLowerCase(); });
    aliasToCanonical[canon.toLowerCase()] = canon.toLowerCase();
  });

  /* ---- Step 2: 从 JD 中找出所有被引用的技能词 ---- */
  const jdHitSet = new Map(); // canonical → { raw, weight, freq }
  JD_SKILL_POOL.forEach(([raw, weight]) => {
    const canon = aliasToCanonical[raw.toLowerCase()] || raw.toLowerCase();
    const re = new RegExp(raw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\b/g,'\\b'), 'gi');
    let m, freq = 0;
    while ((m = re.exec(jd)) !== null) {
      freq++;
      // 避免零宽匹配死循环
      if (m.index === re.lastIndex) re.lastIndex++;
    }
    if (freq > 0) {
      const existing = jdHitSet.get(canon);
      if (existing) {
        existing.freq = Math.max(existing.freq, freq);
        existing.weight = Math.max(existing.weight, weight);
      } else {
        jdHitSet.set(canon, { raw, weight, freq });
      }
    }
    // 额外：检查同义词
    if (!freq && ATS_THESAURUS[canon]) {
      ATS_THESAURUS[canon].forEach(alias => {
        const reA = new RegExp(alias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        let m2, f2 = 0;
        while ((m2 = reA.exec(jd)) !== null) {
          f2++;
          if (m2.index === reA.lastIndex) reA.lastIndex++;
        }
        if (f2 > 0) {
          const existing = jdHitSet.get(canon);
          if (existing) { existing.freq = Math.max(existing.freq, f2); existing.weight = Math.max(existing.weight, weight); }
          else { jdHitSet.set(canon, { raw, weight, freq: f2 }); }
        }
      });
    }
  });

  const jdKeywords = Array.from(jdHitSet.entries()).map(([k,v]) => ({ canon: k, ...v }));

  /* ---- Step 3: 简历板块识别 ---- */
  const sections = { skill:[], project:[], work:[], edu:[] };
  const lines = resume.split(/\n|；|;/);
  let currentSection = 'other';
  lines.forEach(line => {
    const l = line.trim().toLowerCase();
    if (!l) return;
    for (const [sec, markers] of Object.entries(ATS_SECTION_MARKERS)) {
      if (markers.some(m => l.includes(m.toLowerCase()))) { currentSection = sec; break; }
    }
    if (sections[currentSection]) sections[currentSection].push(l);
    else sections.project.push(l); // 默认归入项目/工作
  });
  const sectionText = Object.fromEntries(Object.entries(sections).map(([k,v]) => [k, v.join('\n')]));

  // 板块权重表
  const SECTION_WEIGHT = { skill: 1.6, project: 1.3, work: 1.1, edu: 0.9, other: 0.5 };

  /* ---- Step 4: 简历中每个 JD 关键词的命中情况 ---- */
  const matches = jdKeywords.map(kw => {
    // 主词匹配
    const canonRe = new RegExp(kw.canon.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    let canonFreq = 0, cm;
    while ((cm = canonRe.exec(resume)) !== null) { canonFreq++; if (cm.index === canonRe.lastIndex) canonRe.lastIndex++; }

    // 同义词匹配（去重）
    let aliasFreq = 0;
    if (ATS_THESAURUS[kw.canon]) {
      ATS_THESAURUS[kw.canon].forEach(alias => {
        if (alias.toLowerCase() === kw.canon) return;
        const aRe = new RegExp(alias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        let am;
        while ((am = aRe.exec(resume)) !== null) { aliasFreq++; if (am.index === aRe.lastIndex) aRe.lastIndex++; }
      });
    }
    const totalFreq = Math.max(canonFreq, aliasFreq);

    // 板块分布
    const hitSections = [];
    for (const [sec, text] of Object.entries(sectionText)) {
      const sRe = new RegExp(kw.canon.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      if (sRe.test(text)) hitSections.push(sec);
    }

    return {
      ...kw,
      totalFreq,
      canonHit: canonFreq > 0,
      aliasHit: aliasFreq > 0 && canonFreq === 0,
      hit: totalFreq > 0,
      hitSections,
      // 板块加权得分
      sectionScore: hitSections.length > 0
        ? hitSections.reduce((s, sec) => s + (SECTION_WEIGHT[sec] || 0.8), 0)
        : 0,
    };
  });

  /* ---- Step 5: 六个维度的评分 ---- */

  // 维度 1: 关键词命中率（45 分）
  // 硬技能权重高、软技能权重低；缺失的硬技能扣分多
  const hardHits   = matches.filter(m => m.hit && ATS_HARD_SKILLS.has(m.canon)).length;
  const hardTotal  = matches.filter(m => ATS_HARD_SKILLS.has(m.canon)).length;
  const softHits   = matches.filter(m => m.hit && ATS_SOFT_SKILLS.has(m.canon)).length;
  const softTotal  = matches.filter(m => ATS_SOFT_SKILLS.has(m.canon)).length;
  const hardRate   = hardTotal ? hardHits / hardTotal : 1;
  const softRate   = softTotal ? softHits / softTotal : 1;
  const d1 = Math.round((hardRate * 0.7 + softRate * 0.3) * 45);

  // 维度 2: 频率加权（15 分）
  // 命中的关键词平均频率；JD 里高频词在简历也高频出现 → 得分高
  const hitMatches = matches.filter(m => m.hit);
  let freqScore = 0;
  hitMatches.forEach(m => {
    // 简历频率 vs JD 频率：简历 >= JD → 满分；简历是 JD 的 0.5x → 半分
    const ratio = Math.min(m.totalFreq / Math.max(m.freq, 1), 2); // 2x 封顶
    freqScore += Math.min(ratio, 1.5);
  });
  const freqMax = hitMatches.length * 1.5;
  const d2 = hitMatches.length ? Math.round((freqScore / freqMax) * 15) : 0;

  // 维度 3: 板块加权（15 分）
  // 关键词出现在正确的板块里得分：技能栏 > 项目 > 工作 > 教育
  const sectionScoreSum = hitMatches.reduce((s, m) => s + m.sectionScore, 0);
  // 理论最大值：每个命中在 skill 板块 → 每个 1.6 分
  const sectionMax = hitMatches.length * 1.6;
  const d3 = hitMatches.length ? Math.round(Math.min(sectionScoreSum / sectionMax, 1) * 15) : 0;

  // 维度 4: JD 词密度（10 分）
  // 简历覆盖了 JD 里多少独特的通用词汇（排除停用词）
  const jdWords = new Set(
    jd
      .replace(UNIT, ' ')
      .match(/[\u4e00-\u9fa5]{2,}|[a-zA-Z]+/g)
      ?.map(w => w.toLowerCase())
      .filter(w => w.length > 2 && !UNIT.test(w)) || []
  );
  const resWords = new Set(resume.match(/[\u4e00-\u9fa5]{2,}|[a-zA-Z]+/g)?.map(w => w.toLowerCase()) || []);
  let overlap = 0;
  jdWords.forEach(w => { if (resWords.has(w)) overlap++; });
  const density = jdWords.size ? overlap / jdWords.size : 0;
  const d4 = Math.round(Math.min(density * 2, 1) * 10);

  // 维度 5: STAR 量化检查（10 分）
  // 简历里有多少个"动词 + 数字 + 结果"的模式
  const strongVerbs = /(主导|设计|开发|优化|推动|搭建|实现|重构|负责|交付|领导|发起|发布)/g;
  const hasMetrics  = /\d+(\.\d+)?\s*(%|万|k|人|次|倍|ms|s|小时|天|个|条|元)|[+-]?\d+(\.\d+)?%/.test(resume);
  const verbCount   = (resume.match(strongVerbs) || []).length;
  const metricCount = (resume.match(/\d+(\.\d+)?\s*(%|万|k|倍|人|ms|s)/g) || []).length;
  const starsRaw    = Math.min(
    (verbCount >= 5 ? 1 : verbCount / 5) * 0.5 +
    (metricCount >= 3 ? 1 : metricCount / 3) * 0.5,
    1
  );
  const d5 = Math.round(starsRaw * 10);

  // 维度 6: 内容丰富度（5 分）
  const wc = resume.replace(/\s/g, '').length;
  const wcScore = Math.min(wc / 1500, 1); // 1500 字满分
  const hasSkill  = sectionText.skill.length > 30;
  const hasProj   = sectionText.project.length > 50;
  const hasWork   = sectionText.work.length > 30;
  const hasEdu    = sectionText.edu.length > 20;
  const secScore  = (hasSkill + hasProj + hasWork + hasEdu) / 4;
  const d6 = Math.round((wcScore * 0.4 + secScore * 0.6) * 5);

  // 总分
  const total = Math.min(100, Math.max(0, d1 + d2 + d3 + d4 + d5 + d6));

  /* ---- Step 6: 生成可解释的建议 ---- */
  const missingHard   = matches.filter(m => !m.hit && ATS_HARD_SKILLS.has(m.canon));
  const missingSoft   = matches.filter(m => !m.hit && ATS_SOFT_SKILLS.has(m.canon));
  const aliasOnlyHits = matches.filter(m => m.aliasHit); // 用同义词命中的 —— 建议用主词
  const weakSectionHits = hitMatches.filter(m => !m.hitSections.includes('skill') && !m.hitSections.includes('project'));

  const suggestions = [];
  if (missingHard.length > 0) {
    suggestions.push({
      type: 'critical',
      text: `补充缺失的硬技能：${missingHard.slice(0,5).map(m=>m.raw).join('、')}${missingHard.length>5?'...':''} — 优先放进"专业技能"栏和相关项目描述里`,
    });
  }
  if (aliasOnlyHits.length > 0) {
    suggestions.push({
      type: 'info',
      text: `有 ${aliasOnlyHits.length} 个关键词用同义词命中：${aliasOnlyHits.slice(0,3).map(m=>m.raw).join('、')} — 直接用 JD 里出现的那个术语会更稳`,
    });
  }
  if (weakSectionHits.length > 0 && hasSkill) {
    suggestions.push({
      type: 'info',
      text: `有 ${weakSectionHits.length} 个关键词没出现在"技能栏"里 — 把 ${weakSectionHits.slice(0,3).map(m=>m.raw).join('、')} 也加进技能清单`,
    });
  }
  if (!hasMetrics || metricCount < 2) {
    suggestions.push({
      type: 'warn',
      text: '项目经历里缺少量化数据 — 每个项目建议至少有一个数字（%、K、人、倍、ms）',
    });
  }
  if (verbCount < 3) {
    suggestions.push({
      type: 'warn',
      text: '项目描述的动词不够有力 — 多用"主导 / 设计 / 优化 / 重构"这类强动词',
    });
  }
  if (d4 < 6) {
    suggestions.push({
      type: 'info',
      text: `JD 里有一些通用词汇简历没覆盖到 — 把 JD 的核心描述改写进自己的项目里（不要照抄，用自己的经历重新表达）`,
    });
  }

  return {
    total,
    dims: [
      { name: '关键词命中率',     score: d1, max: 45,
        desc: `硬技能命中 ${hardHits}/${hardTotal} · 软技能 ${softHits}/${softTotal}` },
      { name: '关键词频率加权',   score: d2, max: 15,
        desc: `命中词的简历频率 vs JD 频率` },
      { name: '板块加权',         score: d3, max: 15,
        desc: `关键词出现在"技能/项目"板块得分更高` },
      { name: 'JD 词密度',        score: d4, max: 10,
        desc: `简历覆盖 JD 独特词汇的比例` },
      { name: 'STAR 量化',        score: d5, max: 10,
        desc: `强动词 ${verbCount} 个 · 量化数据 ${metricCount} 处` },
      { name: '内容丰富度',       score: d6, max: 5,
        desc: `${wc} 字 · ${(hasSkill?'技能':'—')} ${hasProj?'项目':'—'} ${hasWork?'工作':'—'} ${hasEdu?'教育':'—'}` },
    ],
    matches, jdKeywords,
    hardRate, softRate,
    hitMatches,
    missingHard, missingSoft,
    aliasOnlyHits, weakSectionHits,
    suggestions,
    sections: { hasSkill, hasProj, hasWork, hasEdu, wc },
  };
}

/* ---------- 渲染结果 ---------- */
function renderATSResult(a) {
  const { total, dims, matches, suggestions, missingHard, missingSoft, sections } = a;

  const strokeColor = total >= 75 ? '#2D6A4F' : total >= 50 ? '#B8860B' : '#B23A48';
  const R = 60, C = 2 * Math.PI * R;

  let html = '';

  // 总分仪表盘
  html += `
    <div class="ats-score-wrap">
      <div class="ats-ring">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="ats-ring-bg" cx="70" cy="70" r="${R}"/>
          <circle class="ats-ring-fg" cx="70" cy="70" r="${R}"
            stroke="${strokeColor}"
            stroke-dasharray="${C}"
            stroke-dashoffset="${C * (1 - total/100)}"/>
        </svg>
        <div class="ats-ring-center">
          <div class="ats-num" style="color:${strokeColor}">${total}</div>
          <div class="ats-label">ATS 匹配分</div>
        </div>
      </div>
      <div class="ats-meta">
        <div><b>${matches.filter(m=>m.hit).length}</b> 命中 / <b>${matches.length}</b> JD 关键词</div>
        <div>硬技能命中率 <b style="color:${a.hardRate>=0.8?'var(--ok)':a.hardRate>=0.5?'var(--warn)':'var(--bad)'}">${Math.round(a.hardRate*100)}%</b></div>
        <div>软技能命中率 <b>${Math.round(a.softRate*100)}%</b></div>
        <div style="margin-top:8px;color:${strokeColor}">
          ${total>=75?'✅ 大概率通过 ATS 筛选':total>=50?'⚠️ 建议针对性优化缺失项':'❌ 很可能被刷'}
        </div>
      </div>
    </div>`;

  // 六个维度得分条
  html += `<h4 style="margin:28px 0 12px">📊 六维度拆解</h4>`;
  dims.forEach(d => {
    const pct = Math.round(d.score / d.max * 100);
    const barColor = pct >= 75 ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--bad)';
    html += `
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px">
          <span><b>${d.name}</b> · ${d.desc}</span>
          <span style="color:${barColor};font-family:var(--font-mono);font-weight:600">${d.score}/${d.max}</span>
        </div>
        <div style="background:var(--bg-subtle);height:8px;border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${barColor};border-radius:4px;transition:width .6s var(--ease)"></div>
        </div>
      </div>`;
  });

  // 命中详情（按类别分组）
  const foundList = matches.filter(m => m.hit);
  html += `<h4 style="margin:28px 0 12px">✅ 已命中关键词（${foundList.length}/${matches.length}）</h4>`;
  html += `<div class="kw-list">`;
  foundList.forEach(m => {
    const sectionTag = m.hitSections.length ? ` [${m.hitSections.join('/')}]` : '';
    const freqTag = m.totalFreq > 1 ? ` ×${m.totalFreq}` : '';
    const aliasTag = m.aliasHit ? ' 🔄' : '';
    html += `<span class="kw-chip ok" title="${m.raw}${sectionTag}${freqTag}${aliasTag}">${m.raw}${freqTag}</span>`;
  });
  html += `</div>`;

  // 缺失硬技能（重点）
  if (missingHard.length) {
    html += `<h4 style="margin:24px 0 12px;color:var(--bad)">❌ 缺失的硬技能（高优先级补充）</h4>`;
    html += `<div class="kw-list">`;
    missingHard.forEach(m => {
      const weightTag = m.weight >= 1.2 ? ' ★' : '';
      html += `<span class="kw-chip bad">${m.raw}${weightTag}</span>`;
    });
    html += `</div>`;
  }

  if (missingSoft.length) {
    html += `<h4 style="margin:20px 0 12px;color:var(--text-dim)">△ 缺失的软技能</h4>`;
    html += `<div class="kw-list">`;
    missingSoft.forEach(m => html += `<span class="kw-chip" style="background:var(--bg-subtle);color:var(--text-dim);border:1px dashed var(--text-line)">${m.raw}</span>`);
    html += `</div>`;
  }

  // 建议
  if (suggestions.length) {
    html += `<h4 style="margin:28px 0 12px">💡 针对性优化建议（${suggestions.length} 条）</h4>`;
    suggestions.forEach((s, i) => {
      const colorMap = {
        critical: { bg:'#FDF0EF',  border:'#E8D5D8', text:'var(--bad)' },
        warn:     { bg:'#FBF6E6',  border:'#ECE1B8', text:'var(--warn)' },
        info:     { bg:'#EEF1F6',  border:'#D8DEE8', text:'var(--info)' },
      };
      const c = colorMap[s.type] || colorMap.info;
      html += `<div style="padding:12px 16px;background:${c.bg};border-left:3px solid ${c.text};border-radius:0 8px 8px 0;margin-bottom:10px;font-size:13.5px;color:var(--text)">
        <span style="font-weight:600;color:${c.text}">#${i+1}</span>  ${s.text}
      </div>`;
    });
  }

  // 板块识别结果
  html += `<div class="output" style="margin-top:24px;font-family:var(--font-body);line-height:1.8">
🧠 简历板块识别
──────────────────────
字数：${sections.wc} 字
板块：${sections.hasSkill?'✅ 技能':'❌ 技能缺失'}  ${sections.hasProj?'✅ 项目':'❌ 项目缺失'}  ${sections.hasWork?'✅ 工作':'❌ 工作缺失'}  ${sections.hasEdu?'✅ 教育':'❌ 教育缺失'}

📌 原理说明
──────────────────────
1. 从 JD 中抽取技能词典覆盖的关键词（含同义词归并）
2. 在简历里做多维度匹配：是否出现 + 出现频率 + 出现在哪个板块
3. 硬技能命中率权重高于软技能
4. 关键词出现在"技能栏/项目描述"权重高于出现在别处
5. 加分项：动词 + 数字的 STAR 结构、JD 通用词覆盖率
  </div>`;

  html += `<button class="btn ghost btn-sm" style="margin-top:14px" onclick="cp(document.querySelector('#ats-out').innerText)">📋 复制完整分析</button>`;

  document.getElementById('ats-out').innerHTML = html;
}

function toolKW(c) {
  c.innerHTML = `
    <label>粘贴完整 JD</label>
    <textarea id="kw-jd" placeholder="把职位描述完整贴过来..."></textarea>
    <button class="btn" style="margin-top:12px" onclick="doKW()">提取关键词</button>
    <div id="kw-out"></div>
  `;

  window.doKW = () => {
    const jd = document.getElementById('kw-jd').value.toLowerCase();
    if (!jd) { toast('请先粘贴 JD'); return; }

    const CATS = [
      ['编程语言',   ['python','java','javascript','typescript','go','rust','c++','c#','php','ruby','swift','kotlin','scala']],
      ['前端技术',   ['react','vue','angular','svelte','next.js','nuxt','node.js','webpack','vite','tailwind','redux']],
      ['后端技术',   ['spring','spring boot','django','flask','express','nest.js','fastapi','gin','grpc','graphql']],
      ['数据库',     ['mysql','postgresql','postgres','mongodb','redis','oracle','elasticsearch','clickhouse','dynamodb']],
      ['云 / DevOps',['aws','azure','gcp','docker','kubernetes','k8s','jenkins','terraform','linux','nginx','ci/cd']],
      ['数据 / AI',  ['sql','spark','hadoop','flink','kafka','pytorch','tensorflow','llm','gpt','bert','nlp','机器学习','深度学习','大模型']],
      ['业务 / 产品',['产品','产品经理','用户调研','数据分析','数据驱动','增长','埋点','prd','竞品分析','a/b测试']],
      ['软技能',     ['沟通','团队协作','项目管理','敏捷','scrum','领导力','抗压','学习能力']],
    ];

    let html = '';
    CATS.forEach(([name, words]) => {
      const hit = words.filter(w => jd.includes(w));
      if (hit.length) {
        html += `<div class="kw-group">
          <h4>${name} · ${hit.length} 项</h4>
          <div class="kw-list">${hit.map(w=>`<span class="kw-chip info">${w}</span>`).join('')}</div>
        </div>`;
      }
    });

    // 高频词 Top15
    const seg = jd.match(/[\u4e00-\u9fa5]+|[a-zA-Z]+/gi) || [];
    const skip = new Set(['的','了','和','是','在','对','及','或','与','等','需要','要求','能够','具备','良好','优秀','熟悉','了解','公司','岗位','工作','经验','优先','以及','相关']);
    const freq = {};
    seg.forEach(w => { w = w.toLowerCase(); if (w.length>1 && !skip.has(w)) freq[w] = (freq[w]||0)+1; });
    const top = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,15);
    if (top.length) {
      html += `<div class="kw-group">
        <h4>🔥 JD 高频词 TOP15</h4>
        <div class="kw-list">${top.map(([w,n])=>`<span class="kw-chip info">${w} ×${n}</span>`).join('')}</div>
      </div>`;
    }

    document.getElementById('kw-out').innerHTML = html || '<div class="output">没抽取到。JD 太短？</div>';
  };
}

/* =========================================================
   工具 3: 简历体检
   标准来自《简历写作与投递专业建议手册》
   ========================================================= */
function toolOpt(c) {
  c.innerHTML = `
    <div class="row">
      <div class="col"><label>目标岗位</label><input type="text" id="opt-role" placeholder="如：前端工程师 / 数据分析"></div>
      <div class="col"><label>身份</label>
        <select id="opt-stage">
          <option value="campus">校招 / 实习</option>
          <option value="experienced">社招 / 有经验</option>
        </select>
      </div>
    </div>
    <label>岗位 JD（选填，粘贴后按关键词覆盖率评估相关性）</label>
    <textarea id="opt-jd" class="opt-jd" placeholder="把目标岗位的 JD 粘进来。相关性是招聘方权重最高的一项（80%）。"></textarea>
    <label>简历正文</label>
    ${uploadBoxHtml('opt')}
    <textarea id="opt-resume" class="opt-resume" placeholder="粘贴简历全文，或上传文件自动读取..."></textarea>
    <p class="opt-file-note">文件只在本机浏览器解析，不会上传服务器；扫描版 PDF 请用图片上传走 OCR；旧版 .doc / .ppt 请先另存为 .docx / .pptx。</p>
    <button class="btn" style="margin-top:12px" onclick="doOpt()">开始体检</button>
    <p class="opt-note">先过 10 条格式红线，再按招聘方权重评 5 个维度：相关性 80 · 量化成果 72 · 清晰履历 68 · 具体技能 64 · 教育背景 42。80 分以上再投。</p>
    <div id="opt-out"></div>
  `;

  var VETO_STATE = {};
  var LAST = null;

  function hesc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
  // 英文技能词按整词匹配，避免 go 命中 google、java 命中 javascript
  function kwHit(text, kw) {
    var k = String(kw).toLowerCase();
    if (/^[a-z0-9+#.]+$/i.test(k)) {
      var re = new RegExp('(^|[^a-z0-9])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z0-9]|$)', 'i');
      return re.test(text);
    }
    return String(text).toLowerCase().indexOf(k) >= 0;
  }
  function fmtMonth(idx) {
    var y = 2000 + Math.floor(idx / 12);
    var m = (idx % 12) + 1;
    return y + '.' + String(m).padStart(2, '0');
  }

  var HEAD_MAP = [
    ['work', ['工作经历', '工作经验', '实习经历', '职业经历', '工作背景', 'experience', 'work experience', 'professional experience']],
    ['project', ['项目经历', '项目经验', '项目描述', 'projects', 'project', 'project experience', '开源经历', '开源项目', '开源与社区', '开源社区', '作品集']],
    ['skill', ['专业技能', '技能', '技术栈', '技能清单', 'skills', 'skill', 'tech stack', '技术能力']],
    ['edu', ['教育背景', '教育经历', '学历', 'education']],
    ['summary', ['个人简介', '自我介绍', '自我评价', '求职意向', '摘要', 'summary', 'profile']],
    ['award', ['荣誉', '获奖', '证书', '校园经历', '课外活动', 'awards', 'certificates']],
  ];
  // 长标题优先，避免 "project experience" 被 "project" 截断
  var HEAD_LIST = [];
  HEAD_MAP.forEach(function (g) { g[1].forEach(function (n) { HEAD_LIST.push([g[0], n.toLowerCase()]); }); });
  HEAD_LIST.sort(function (a, b) { return b[1].length - a[1].length; });

  function splitSections(text) {
    var out = {}, cur = 'other';
    text.split(/\r?\n/).forEach(function (line) {
      var s = line.trim();
      if (!s) return;
      var low = s.toLowerCase(), hit = null, rest = '';
      for (var i = 0; i < HEAD_LIST.length; i++) {
        var name = HEAD_LIST[i][1];
        if (low === name || low.indexOf(name + ' ') === 0 || low.indexOf(name + '：') === 0 || low.indexOf(name + ':') === 0) {
          hit = HEAD_LIST[i][0];
          rest = s.slice(name.length).replace(/^[\s：:]+/, '');

        relevance = clamp(Math.round(cov * 85 + (aligned ? 15 : 0)), 0, 100);
        relEvidence.push('目标岗位关键词命中 ' + hits.length + ' / ' + roleInfo.kws.length);
        relEvidence.push(aligned ? '摘要已呼应目标岗位' : '摘要未出现岗位关键词');
        if (hits.length) relEvidence.push('命中：' + hits.join('、'));
        if (cov < 0.5) relProblems.push('与目标岗位的关键词重合偏少，建议对照 JD 补原词');
      } else {
        relEvidence.push('未识别岗位类别，粘贴 JD 可精确评估');
      }
    } else {
      relEvidence.push('未提供 JD 或目标岗位，相关性未评估');
    }

    var intentLine = lines.filter(function (l) { return /求职意向/.test(l); })[0] || '';
    var intentPart = intentLine.replace(/^.*?求职意向\s*[：:]?/, '');
    var multiIntent = /[/|、]/.test(intentPart) && intentPart.split(/[/|、]/).filter(Boolean).length >= 2;

    /* ---------- 维度 ---------- */
    var dims = [
      { name: '相关性', score: relevance, weight: 80, evidence: relEvidence, problems: relProblems },
      { name: '量化成果', score: metricScore, weight: 72,
        evidence: [
          '量化数据 ' + metricCount + ' 处',
          '覆盖维度 ' + (metricDims.join('、') || '无'),
          '前后对比 ' + (comparison ? '有' : '无'),
        ], problems: [] },
      { name: '清晰履历', score: clarityScore, weight: 68,
        evidence: [
          '日期区间 ' + ranges.length + ' 段，精确到月 ' + monthRanges.length + ' 段',
          '6 个月以上空窗 ' + gaps.length + ' 段',
          '倒序排列 ' + (reverseOk ? '是' : '疑似否'),
        ], problems: [] },
      { name: '具体技能', score: skillScore, weight: 64,
        evidence: [
          '技能项 ' + skillCount + ' 个',
          '分级 ' + (hasLevels ? '有' : '无'),
          '与项目绑定 ' + bindHits.length + ' 项',
        ], problems: [] },
      { name: '教育背景', score: eduScore, weight: 42,
        evidence: [
          '学校 ' + (hasSchool ? '有' : '缺'),
          '学历 ' + (hasDegree ? '有' : '缺'),
          '专业 ' + (hasMajor ? '有' : '缺'),
          '起止时间 ' + (hasEduTime ? '有' : '缺'),
        ], problems: [] },
    ];
    var active = dims.filter(function (d) { return d.score != null; });
    var evaluatedWeight = active.reduce(function (s, d) { return s + d.weight; }, 0);
    var total = active.length ? Math.round(active.reduce(function (s, d) { return s + d.score * d.weight; }, 0) / evaluatedWeight) : 0;

    /* ---------- 问题清单 ---------- */
    var issues = [];
    function add(level, dim, title, detail, fix) { issues.push({ level: level, dim: dim, title: title, detail: detail, fix: fix }); }

    if (relevance == null) add('mid', '相关性', '相关性未评估', '相关性是招聘方权重最高的一项（80%），没有 JD 时无法准确判断。', '粘贴目标岗位 JD，或至少填写目标岗位，再体检一次。');
    if (multiIntent) add('high', '相关性', '求职意向出现多个方向', '「' + intentPart.trim() + '」会让人怀疑你到底想做什么，是最典型的秒拒信号。', '一份简历只写一个方向，其他方向另做一版。');
    if (ats && ats.missingHard && ats.missingHard.length) add('high', '相关性', '缺少 JD 硬技能关键词', 'ATS 里搜不到：' + ats.missingHard.slice(0, 6).map(function (m) { return m.raw; }).join('、') + '。', '把 JD 的 5–8 个硬性关键词以原词自然写进技能栏和项目描述。');

    if (!metricCount) add('high', '量化成果', '没有量化成果', '整份简历没有可验证的数字，招聘方无法判断你的产出。', '每条经历至少一个数字：规模、效率、质量、频率任选其一。');
    else if (metricDims.length < 2) add('mid', '量化成果', '量化维度单一', '目前只覆盖「' + (metricDims.join('、') || '无') + '」，说服力有限。', '从规模 / 效率 / 质量 / 频率中至少覆盖两类。');
    if (!comparison) add('low', '量化成果', '缺少前后对比', '只有结果数字，没有基准，读者不知道这个数字好不好。', '写成「从 A 提升到 B」「周期从 7 天缩短到 2 天」。');
    if (weakLines.length) add('high', '量化成果', weakLines.length + ' 条职责描述没有结果', '出现「负责 / 参与 / 协助」但整句没有数字，读起来像岗位说明书。', '用 PAR 重写：遇到什么问题 → 你做了什么 → 结果是什么。');

    if (!ranges.length) add('high', '清晰履历', '没有起止时间', '工作 / 项目经历缺少时间，HR 无法判断你的履历连续性。', '每段经历写清「2022.03–2024.12」，倒序排列。');
    if (yearRanges.length) add('high', '清晰履历', yearRanges.length + ' 段经历只写年份', '只写年份会让人怀疑在隐藏空窗，部分 ATS 还会解析失败。', '全部精确到月，统一日期格式。');
    if (gaps.length) add('high', '清晰履历', '发现 ' + gaps.length + ' 段 6 个月以上空窗', '空窗：' + gaps.map(function (g) { return g.from + '–' + g.to + '（' + g.months + ' 个月）'; }).join('；') + '。6 个月以上空窗会被 HR 反复追问，不解释就按风险处理。', '用一条带日期的记录占位，写清备考、项目、照护或求职安排。');
    if (!reverseOk) add('mid', '清晰履历', '经历疑似未按倒序排列', '最近的在最前，HR 才能在几秒内看到你现在的水平。', '把最近一段经历放到最上面。');
    if (ranges.length >= 4) add('mid', '清晰履历', '5 年内经历较多', '5 年内超过 3 份工作，HR 会开始警惕稳定性。', '在每段短经历旁写一句离职逻辑，合同制要标注合同期。');

    if (!skillText) add('high', '具体技能', '缺少技能板块', '没有独立技能栏，ATS 很难抓取你的技术栈。', '新增「专业技能」，按精通 / 熟练 / 了解分级。');
    else {
      if (skillCount > 20) add('mid', '具体技能', '技能罗列过多', '当前 ' + skillCount + ' 项，重点被稀释。', '压缩到 10–15 项，只保留与 JD 对应的技能。');
      if (!hasLevels) add('mid', '具体技能', '技能没有分级', '全部平铺，招聘方无法判断熟练程度。', '分「精通 3–5 项 / 熟练 5–8 项 / 了解若干」。');
      if (bindHits.length < 2) add('low', '具体技能', '技能与项目脱节', '技能栏里的词没有在项目里出现，可信度低。', '每个核心技能配一个项目结果，例如「Redis 缓存优化，响应从 80ms 降到 28ms」。');
    }
    if (cliche) add('mid', '具体技能', '自我评价是套话', '「沟通能力强 / 抗压能力强」这类句子没有信息量。', '删掉，或换成一句有数字的记忆点。');

    if (!eduText) add('high', '教育背景', '缺少教育背景板块', '学校、专业、学历、时间是校招简历的基础信息。', '补齐「学校 / 专业 / 学历 / 起止时间」。');
    else if (eduN < 4) {
      var missEdu = [hasSchool ? '' : '学校', hasDegree ? '' : '学历', hasMajor ? '' : '专业', hasEduTime ? '' : '起止时间'].filter(Boolean);
      add('mid', '教育背景', '教育信息不完整', '教育信息是校招筛选的基础字段，缺失会被 ATS 或 HR 直接跳过（缺：' + missEdu.join('、') + '）。', '四项补齐；应届生再补相关课程、竞赛、证书。');
    }
    if (fresh && !eduExtra) add('low', '教育背景', '应届生缺少教育补充', '没有课程、竞赛、奖学金或证书，教育栏信息量偏少。', '补 2–3 项与岗位相关的课程 / 竞赛 / 证书。');

    if (wordCount > 2200 && stage === 'campus') add('mid', '篇幅', '篇幅偏长', '当前约 ' + wordCount + ' 字；0–7 年经验建议一页，过长会稀释重点。', '删掉无关经历，把早期经历压缩成「公司 + 职位 + 时间」。');
    if (wordCount < 300) add('mid', '篇幅', '内容过短', '当前约 ' + wordCount + ' 字，信息量不足以支撑判断。', '补项目背景、个人动作和结果，每条 1–2 行。');

    var levelRank = { high: 0, mid: 1, low: 2 };
    issues.sort(function (a, b) { return levelRank[a.level] - levelRank[b.level]; });

    return {
      raw: text, role: role, jd: jd, stage: stage, wordCount: wordCount,
      sections: sections, veto: veto, ranges: ranges, gaps: gaps,
      metricCount: metricCount, metricDims: metricDims, comparison: comparison,
      weakLines: weakLines, skillCount: skillCount, cliche: cliche,
      dims: dims, total: total, evaluatedWeight: evaluatedWeight,
      issues: issues, roleInfo: roleInfo, fresh: fresh,
      hasWork: !!sections.work,
    };
  }

  /* ---------- 渲染 ---------- */
  function gateInfo(res) {
    var autoFails = res.veto.filter(function (v) { return v.type === 'auto' && !v.pass; }).length;
    var manual = res.veto.filter(function (v) { return v.type === 'manual'; });
    var fail = manual.filter(function (v) { return VETO_STATE[v.id] === 'fail'; }).length;
    var pending = manual.filter(function (v) { return !VETO_STATE[v.id]; }).length;
    var pass = res.veto.length - autoFails - fail - pending;
    return {
      autoFails: autoFails, fail: fail, pending: pending, pass: pass,
      status: (autoFails + fail) ? 'fail' : pending ? 'pending' : 'pass',
    };
  }
  function verdictHtml(res, g) {
    var tone = 'warn', title = '优化后再投';
    if (g.status === 'fail') { tone = 'bad'; title = '先修格式红线'; }
    else if (g.status === 'pending') { tone = 'warn'; title = '补确认格式红线'; }
    else if (res.total >= 80) {
      tone = res.dims[0].score == null ? 'warn' : 'ok';
      title = res.dims[0].score == null ? '内容达标，补 JD 确认相关性' : '可以投递';
    }
    else if (res.total < 65) { tone = 'bad'; title = '暂缓投递，先重写核心经历'; }

    return '<div class="opt-verdict ' + tone + '">'
      + '<div class="opt-score"><b style="color:' + (tone === 'ok' ? 'var(--ok)' : tone === 'bad' ? 'var(--bad)' : 'var(--warn)') + '">' + res.total + '</b><span>/100</span></div>'
      + '<div class="opt-verdict-main"><div class="opt-verdict-title">' + title + '</div>'
      + '<div class="opt-verdict-sub">格式红线 ' + g.pass + ' / 10 通过'
      + (g.pending ? ' · ' + g.pending + ' 项待确认' : '')
      + (g.status === 'fail' ? ' · 有未通过项，内容分仅供参考' : '')
      + '<br>内容加权 ' + res.total + ' 分 · 已计入权重 ' + res.evaluatedWeight
      + (res.dims[0].score == null ? ' · 相关性未评估（权重 80）' : '')
      + ' · 五维明细见下方'
      + '</div></div></div>';
  }

  function vetoHtml(res, g) {
    var rows = res.veto.map(function (v) {
      if (v.type === 'auto') {
        return '<div class="opt-veto-row"><div class="opt-veto-main"><b>' + hesc(v.label) + '</b><span>' + hesc(v.detail) + '</span>'
          + (v.pass ? '' : '<span class="opt-veto-fix">改法：' + hesc(v.fix) + '</span>')
          + '</div><span class="opt-pill ' + (v.pass ? 'ok' : 'bad') + '">' + (v.pass ? '通过' : '不通过') + '</span></div>';
      }
      var st = VETO_STATE[v.id];
      return '<div class="opt-veto-row"><div class="opt-veto-main"><b>' + hesc(v.label) + '</b><span>' + hesc(v.fix) + '</span></div>'
        + '<div class="opt-seg"><button class="' + (st === 'pass' ? 'on ok' : '') + '" onclick="optVeto(\'' + v.id + '\',\'pass\')">通过</button>'
        + '<button class="' + (st === 'fail' ? 'on bad' : '') + '" onclick="optVeto(\'' + v.id + '\',\'fail\')">不通过</button></div></div>';
    }).join('');

    return '<section class="opt-sec"><h4>格式红线 <span class="opt-sec-sub">任一不通过，先改格式，再谈内容</span></h4>'
      + '<div class="opt-veto-sum"><span class="opt-pill ok">通过 ' + g.pass + '</span>'
      + (g.pending ? '<span class="opt-pill warn">待确认 ' + g.pending + '</span>' : '')
      + ((g.fail + g.autoFails) ? '<span class="opt-pill bad">不通过 ' + (g.fail + g.autoFails) + '</span>' : '')
      + '</div><div class="opt-veto">' + rows + '</div>'
      + (g.pending ? '<button class="opt-link" onclick="optVetoAllPass()">我已逐项核对，剩余项全部通过</button>' : '')
      + '</section>';
  }

  function dimsHtml(res) {
    return '<section class="opt-sec"><h4>五维评分 <span class="opt-sec-sub">按招聘方权重加权，80 分以上再投</span></h4>'
      + res.dims.map(function (d) {
        var has = d.score != null;
        return '<div class="opt-dim"><div class="opt-dim-head"><b>' + d.name + '</b>'
          + '<span class="opt-pill ' + (!has ? 'warn' : d.score >= 80 ? 'ok' : d.score >= 60 ? 'warn' : 'bad') + '">' + (has ? d.score : '未评估') + '</span>'
          + '<em>权重 ' + d.weight + '</em></div>'
          + '<ul>' + d.evidence.map(function (e) { return '<li>' + hesc(e) + '</li>'; }).join('') + '</ul>'
          + (d.problems.length ? d.problems.map(function (p) { return '<div class="opt-dim-problem">待改：' + hesc(p) + '</div>'; }).join('') : '')
          + '</div>';
      }).join('') + '</section>';
  }

  function issuesHtml(res, g) {
    var top = res.issues.slice(0, 8);
    var failCount = g.fail + g.autoFails;
    var failedLabels = res.veto.filter(function (v) {
      return v.type === 'auto' ? !v.pass : VETO_STATE[v.id] === 'fail';
    }).map(function (v) { return v.label; });
    var gateNote = '';
    if (failCount) {
      gateNote = '<div class="opt-issue"><span class="opt-pill bad">高</span>'
        + '<div class="opt-issue-main"><b>格式红线有 ' + failCount + ' 项不通过'
        + (failedLabels.length ? '：' + failedLabels.slice(0, 3).join('、') + (failedLabels.length > 3 ? ' 等' : '') : '')
        + '</b>'
        + '<p class="opt-reason"><em>原因</em>格式关未过时，内容分仅供参考，招聘方可能直接筛掉。</p>'
        + '<div class="opt-fix">改法：在下方「格式红线」中逐项处理，全部通过后再投。</div></div></div>';
    } else if (g.pending) {
      gateNote = '<div class="opt-issue"><span class="opt-pill warn">待办</span>'
        + '<div class="opt-issue-main"><b>格式红线还有 ' + g.pending + ' 项待确认</b>'
        + '<p class="opt-reason"><em>原因</em>PDF、文件名、字体等无法从文本自动判断，不确认就可能带着硬伤投出去。</p>'
        + '<div class="opt-fix">改法：在下方「格式红线」中逐项确认，全部通过后再投。</div></div></div>';
    }
    if (!top.length && !gateNote) return '<section class="opt-sec"><h4>修改建议</h4><div class="opt-success">未发现明显问题。签约前再核对合同、投递渠道和面试口径。</div></section>';
    var label = { high: '高', mid: '中', low: '低' };
    return '<section class="opt-sec"><h4>修改建议 <span class="opt-sec-sub">先改这些，再投</span></h4>'
      + gateNote
      + top.map(function (it, idx) {
        return '<div class="opt-issue"><span class="opt-pill ' + (it.level === 'high' ? 'bad' : it.level === 'mid' ? 'warn' : 'ok') + '">' + label[it.level] + '</span>'
          + '<div class="opt-issue-main"><b>#' + (idx + 1) + ' ' + hesc(it.title) + '</b>'
          + '<p class="opt-reason"><em>原因</em>' + hesc(it.detail) + '</p>'
          + '<div class="opt-fix">改法：' + hesc(it.fix) + '</div></div></div>';
      }).join('') + '</section>';
  }

  function suggestionFor(line) {
    if (/社群|运营/.test(line)) return '主导 30 个社群运营，日活转化率提升 15%';
    if (/系统|开发|接口/.test(line)) return '独立承担订单模块重构，接口响应从 800ms 降到 120ms';
    if (/项目|协助/.test(line)) return '推动 3 个部门协同，项目提前 2 周交付';
    if (/效率|流程/.test(line)) return '把审批周期从 7 天缩短到 2 天';
    return '用「主导 / 设计 / 优化 + 对象 + 数字结果」重写';
  }
  function exprHtml(res) {
    var rows = res.weakLines.map(function (l) {
      return '<div class="opt-expr"><div class="old">' + hesc(l) + '</div><div class="new">' + hesc(suggestionFor(l)) + '</div></div>';
    }).join('');
    var table = [
      ['负责社群运营', '主导 30 个社群运营，日活转化率提升 15%'],
      ['参与系统开发', '独立承担订单模块重构，接口响应从 800ms 降到 120ms'],
      ['提高了工作效率', '把审批周期从 7 天缩短到 2 天'],
    ].map(function (r) {
      return '<div class="opt-expr"><div class="old">' + hesc(r[0]) + '</div><div class="new">' + hesc(r[1]) + '</div></div>';
    }).join('');
    return '<section class="opt-sec"><h4>表达替换 <span class="opt-sec-sub">弱表达 → 强表达</span></h4>'
      + (rows || '<p class="opt-note" style="margin-top:0">未检测到「负责 / 参与 / 协助」且无数字的句子。</p>')
      + '<details class="opt-more" style="margin-top:10px"><summary>查看更多标准替换</summary>' + table + '</details></section>';
  }

  function notesHtml(res) {
    var tip = '';
    if (res.roleInfo) tip = res.roleInfo.tip;
    else if (res.fresh && !res.hasWork) tip = '0 实习不等于没有经历：课程大作业、毕设、竞赛、社团、开源项目都能写进项目经历，每条至少一个数字。';
    else if (res.fresh) tip = '校招简历建议一页：每段实习写清公司、部门、岗位、时间和 2–4 条结果；把与 JD 最相关的经历放最前。';
    if (!tip) return '';
    return '<section class="opt-sec"><h4>岗位侧重</h4><p class="opt-role-tip">' + hesc(tip) + '</p></section>';
  }

  function deliveryHtml() {
    return '<details class="opt-more"><summary>投递执行与面试一致性（手册第 7、8 节）</summary><div class="opt-check-list">'
      + '<div>岗位发布 48 小时内投递，优先内推，再走官网</div>'
      + '<div>每周精准投递 ≤15 个，避免同质海投</div>'
      + '<div>邮件标题：姓名-应聘岗位-关键匹配点；正文 150–250 字，逐条回应 JD 的硬要求</div>'
      + '<div>附件只放一个 PDF，命名：姓名-岗位-年限-电话</div>'
      + '<div>网申预留时间，填写内容与简历逐字一致</div>'
      + '<div>记录投递台账：日期、公司 / 岗位、渠道、是否内推、是否有回音</div>'
      + '<div>面试前：每个数字能讲清背景、口径和计算方式</div>'
      + '<div>简历、LinkedIn、作品集的日期和职位完全一致；准备 5–7 个 STAR 故事和 3 个高质量反问</div>'
      + '<div>AI 参与写过的内容，逐句核对事实，避免模板痕迹</div>'
      + '</div></details>';
  }

  function renderOpt(res) {
    var out = document.getElementById('opt-out');
    if (!out) return;
    var g = gateInfo(res);
    out.innerHTML = verdictHtml(res, g) + issuesHtml(res, g) + exprHtml(res) + notesHtml(res)
      + '<div class="opt-detail-head">详细评估</div>'
      + vetoHtml(res, g) + dimsHtml(res) + deliveryHtml()
      + '<p class="opt-note">评分口径来自《简历写作与投递专业建议手册》第 10 节；格式红线优先于内容分，所有判断仅基于粘贴文本，不构成法律意见。</p>';
  }

  window.doOpt = function () {
    var raw = document.getElementById('opt-resume').value.trim();
    var role = document.getElementById('opt-role').value.trim();
    var jd = document.getElementById('opt-jd').value.trim();
    var stage = document.getElementById('opt-stage').value;
    if (!raw) { toast('请先粘贴或上传简历'); return; }
    VETO_STATE = {};
    LAST = analyze(raw, role, jd, stage);
    renderOpt(LAST);
    var out = document.getElementById('opt-out');
    var modal = document.getElementById('modal');
    if (out && modal) {
      var delta = out.getBoundingClientRect().top - modal.getBoundingClientRect().top;
      modal.scrollTo({ top: Math.max(0, modal.scrollTop + delta - 76), behavior: 'smooth' });
    } else if (out) {
      out.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  };
  window.optVeto = function (id, val) {
    VETO_STATE[id] = val;
    if (LAST) renderOpt(LAST);
  };
  window.optVetoAllPass = function () {
    LAST.veto.filter(function (v) { return v.type === 'manual'; }).forEach(function (v) {
      if (!VETO_STATE[v.id]) VETO_STATE[v.id] = 'pass';
    });
    renderOpt(LAST);
  };

  mountUpload('opt', 'opt-resume');
}

      <input type="file" id="tr-file" accept=".json" style="display:none" onchange="trImport(event)">
      <button class="btn ghost btn-sm" style="margin-left:auto;color:var(--bad);border-color:#E8D5D8" onclick="trClear()">清空</button>
    </div>

    <div id="tr-body"></div>
  `;

  const KEY = 'careerKit_tracker';
  const load = () => JSON.parse(localStorage.getItem(KEY) || '[]');
  const save = l => { localStorage.setItem(KEY, JSON.stringify(l)); trRender(); };

  window.trAdd = () => {
    const co = document.getElementById('tr-co').value.trim();
    const ro = document.getElementById('tr-ro').value.trim();
    if (!co || !ro) { toast('公司和岗位必填'); return; }
    const list = load();
    list.unshift({
      id: Date.now(),
      company: co, role: ro,
      platform: document.getElementById('tr-pl').value,
      salary: document.getElementById('tr-sa').value.trim(),
      status: document.getElementById('tr-st').value,
      date: new Date().toISOString().slice(0,10),
    });
    save(list);
    document.getElementById('tr-co').value = '';
    document.getElementById('tr-ro').value = '';
    document.getElementById('tr-sa').value = '';
    toast('已添加');
  };

  window.trDel = id => {
    if (!confirm('删除这条记录？')) return;
    save(load().filter(x => x.id !== id));
  };
  window.trStatus = (id, val) => {
    const list = load();
    const it = list.find(x => x.id === id);
    if (it) { it.status = val; save(list); }
  };
  window.trExport = () => {
    const data = JSON.stringify(load(), null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `career-tracker-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    toast('已导出');
  };
  window.trImport = e => {
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const data = JSON.parse(evt.target.result);
        save([...data, ...load()]);
        toast('导入成功');
      } catch { toast('文件格式不对'); }
    };
    reader.readAsText(e.target.files[0]);
  };
  window.trClear = () => {
    if (!confirm('确定清空所有求职记录？不可撤销')) return;
    save([]);
  };

  const STATUS_LABEL = { applied:'已投递', interview:'面试中', offer:'Offer', rejected:'被拒' };

  function trRender() {
    const list = load();
    const cnt = { applied:0, interview:0, offer:0, rejected:0 };
    list.forEach(x => cnt[x.status]++);

    let html = `
      <div class="summary-row">
        <div class="summary-card"><div class="num">${cnt.applied}</div><div class="lbl">已投递</div></div>
        <div class="summary-card"><div class="num">${cnt.interview}</div><div class="lbl">面试中</div></div>
        <div class="summary-card"><div class="num" style="color:var(--ok)">${cnt.offer}</div><div class="lbl">Offer</div></div>
        <div class="summary-card"><div class="num">${cnt.rejected}</div><div class="lbl">被拒</div></div>
      </div>`;

    if (!list.length) {
      html += `<div style="text-align:center;padding:48px 0;color:var(--text-faint)">
        <div style="font-size:48px;margin-bottom:12px">📭</div>
        还没有记录。加一条试试？
      </div>`;
      document.getElementById('tr-body').innerHTML = html;
      return;
    }

    html += `<table class="track"><thead>
      <tr><th>公司</th><th>岗位</th><th>平台</th><th>薪资</th><th>日期</th><th>状态</th><th></th></tr>
    </thead><tbody>`;
    list.forEach(it => {
      html += `<tr>
        <td style="font-weight:600">${it.company}</td>
        <td>${it.role}</td>
        <td style="color:var(--text-dim)">${it.platform}</td>
        <td style="font-family:var(--font-mono);font-size:12.5px">${it.salary || '—'}</td>
        <td style="color:var(--text-faint);font-size:12px">${it.date}</td>
        <td>
          <select class="status-sel status-${it.status}" onchange="trStatus(${it.id}, this.value)">
            ${['applied','interview','offer','rejected'].map(s=>
              `<option value="${s}" ${s===it.status?'selected':''}>${STATUS_LABEL[s]}</option>`
            ).join('')}
          </select>
        </td>
        <td style="text-align:right">
          <button class="btn ghost btn-sm" style="border:none;padding:4px 8px;font-size:12px;color:var(--text-faint)" onclick="trDel(${it.id})">删除</button>
        </td>
      </tr>`;
    });
    html += '</tbody></table>';

    // 简单漏斗转化率
    if (cnt.applied > 0) {
      const interviewRate = Math.round(cnt.interview / cnt.applied * 100);
      const offerRate     = Math.round(cnt.offer / cnt.applied * 100);
      html += `<div class="output" style="margin-top:16px">
📊 漏斗数据
───────────────
 投递 → 面试  ${cnt.applied} → ${cnt.interview}   转化率 ${interviewRate}%
 投递 → Offer ${cnt.applied} → ${cnt.offer}    转化率 ${offerRate}%
      </div>`;
    }

    document.getElementById('tr-body').innerHTML = html;
  }

  trRender();
}
