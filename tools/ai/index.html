<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>效率小工具 · 校招信息查询</title>
<meta name="description" content="免费在线效率小工具：图片压缩、JSON格式化、二维码生成、时间戳转换、Base64编解码、颜色工具等，无需注册，打开即用。">
<meta name="keywords" content="在线工具,图片压缩,JSON格式化,二维码生成,时间戳转换,Base64,颜色工具,免费工具">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f7f6f3;
  --bg-card: #ffffff;
  --bg-hover: #f1f0ec;
  --border: #e6e4de;
  --border-strong: #d4d1c8;
  --text: #1c1b19;
  --text-muted: #77736a;
  --text-faint: #a5a198;
  --primary: #1c1b19;
  --primary-hover: #3a3934;
  --accent: #2b59ff;
  --success: #2d6a4f;
  --warning: #a86b00;
  --danger: #b23a48;
  --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", Consolas, monospace;
}
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
  font-feature-settings: "tnum" 1;
}

/* Header */
header { max-width: 1080px; margin: 0 auto; padding: 56px 28px 28px; }
header .eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 18px; }
header h1 { font-size: 30px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 10px; }
header p { color: var(--text-muted); font-size: 14.5px; max-width: 560px; }

/* Category Nav */
.cat-nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(247,246,243,.88); backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--border);
}
.cat-nav-inner { max-width: 1080px; margin: 0 auto; padding: 0 28px; display: flex; gap: 26px; overflow-x: auto; }
.cat-btn {
  padding: 14px 0 13px; background: none; border: 0; border-bottom: 1.5px solid transparent;
  color: var(--text-muted); cursor: pointer; font: inherit; font-size: 13.5px; white-space: nowrap; transition: color .15s, border-color .15s;
}
.cat-btn:hover { color: var(--text); }
.cat-btn.active { color: var(--text); border-bottom-color: var(--text); }
.cat-btn .n { font: 11px var(--mono); color: var(--text-faint); margin-left: 5px; }

/* Grid */
.container { max-width: 1080px; margin: 28px auto 0; padding: 0 28px; }
.tools-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  border-top: 1px solid var(--border); border-left: 1px solid var(--border);
}
.tool-card {
  background: var(--bg-card); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  padding: 22px 24px 24px; cursor: pointer; position: relative; transition: background .15s;
  display: flex; flex-direction: column; gap: 6px; min-height: 132px;
}
.tool-card:hover { background: #fcfbf9; }
.tool-card .meta { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--text-faint); letter-spacing: .04em; margin-bottom: 10px; }
.tool-card h3 { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; }
.tool-card p { color: var(--text-muted); font-size: 13.5px; }
.tool-card .go { position: absolute; right: 22px; bottom: 20px; color: var(--text-faint); font-size: 14px; transition: transform .2s, color .2s; }
.tool-card:hover .go { color: var(--text); transform: translateX(3px); }
.tool-icon { display: none; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(28,27,25,.32); display: none;
  align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(2px);
}
.modal-overlay.active { display: flex; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { transform: translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }
.modal {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto;
  box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 24px 60px -20px rgba(28,27,25,.25); animation: rise .22s ease;
}
.modal-header {
  padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; background: var(--bg-card); z-index: 1;
}
.modal-header h2 { font-size: 15.5px; font-weight: 600; }
.close-btn {
  width: 30px; height: 30px; border-radius: 8px; background: transparent; border: 1px solid transparent;
  color: var(--text-muted); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.close-btn:hover { background: var(--bg-hover); color: var(--text); }
.modal-body { padding: 24px; }

/* Form */
textarea, input[type="text"], input[type="number"], select {
  width: 100%; padding: 10px 12px; background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 8px;
  color: var(--text); font: inherit; font-size: 13.5px; resize: vertical; transition: border-color .15s, box-shadow .15s;
}
textarea:focus, input:focus, select:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 3px rgba(28,27,25,.06); }
textarea { min-height: 170px; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; }
label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 12.5px; font-weight: 500; }
.row { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.col { flex: 1; min-width: 140px; }

.btn {
  padding: 9px 16px; background: var(--primary); border: 1px solid var(--primary); border-radius: 8px; color: #fff;
  font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--primary-hover); }
.btn-secondary { background: var(--bg-card); color: var(--text); border-color: var(--border-strong); }
.btn-secondary:hover { background: var(--bg-hover); }
.btn-success { background: var(--success); border-color: var(--success); }

.output-box {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-top: 14px;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.7; word-break: break-all; white-space: pre-wrap; max-height: 320px; overflow-y: auto;
}
.file-upload {
  border: 1px dashed var(--border-strong); border-radius: 10px; padding: 36px; text-align: center; cursor: pointer;
  color: var(--text-muted); font-size: 13.5px; transition: all .15s; position: relative; background: var(--bg);
}
.file-upload:hover, .file-upload.dragover { border-color: var(--text); color: var(--text); }
.file-upload input { display: none; }

.img-preview { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
.img-box { flex: 1; min-width: 200px; text-align: center; }
.img-box img {
  max-width: 100%; border-radius: 8px; border: 1px solid var(--border);
  background: repeating-conic-gradient(#efeee9 0% 25%, #fff 0% 50%) 50% / 16px 16px;
}
.img-box p { margin-top: 6px; color: var(--text-muted); font: 11.5px var(--mono); }

input[type="range"] { width: 100%; -webkit-appearance: none; height: 2px; background: var(--border-strong); border-radius: 2px; outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--text); border-radius: 50%; cursor: pointer; }

.color-input-wrapper { display: flex; align-items: center; gap: 12px; }
.color-input-wrapper input[type="color"] { width: 44px; height: 44px; border: 1px solid var(--border-strong); border-radius: 8px; cursor: pointer; background: none; padding: 2px; }
.color-preview { flex: 1; height: 44px; border-radius: 8px; border: 1px solid var(--border); }
.qr-preview { text-align: center; padding: 20px; background: #fff; border: 1px solid var(--border); border-radius: 10px; margin-top: 14px; }

footer { max-width: 1080px; margin: 56px auto 0; padding: 22px 28px 40px; color: var(--text-faint); font-size: 12px; border-top: 1px solid var(--border); }

.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(16px);
  background: var(--text); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px;
  opacity: 0; transition: all .2s; z-index: 2000; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

@media (max-width: 640px) {
  header { padding: 36px 18px 20px; } header h1 { font-size: 24px; }
  .cat-nav-inner, .container { padding: 0 18px; } .modal-body { padding: 18px; }
  .tools-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Utilities · 17 tools</div>
  <h1>效率小工具</h1>
  <p>写简历、处理材料、调试代码时用得上的小工具。全部在浏览器本地运行，文件和文本不会上传。</p>
</header>

<nav class="cat-nav"><div class="cat-nav-inner">
  <button class="cat-btn active" data-cat="all">全部<span class="n"></span></button>
  <button class="cat-btn" data-cat="image">图片<span class="n"></span></button>
  <button class="cat-btn" data-cat="text">文本<span class="n"></span></button>
  <button class="cat-btn" data-cat="code">开发<span class="n"></span></button>
  <button class="cat-btn" data-cat="convert">转换<span class="n"></span></button>
  <button class="cat-btn" data-cat="generate">生成<span class="n"></span></button>
</div></nav>

<div class="container">
  <section id="all" class="tools-grid">
    <!-- Tools will be injected by JS -->
  </section>
</div>

<!-- Modal Container -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">工具</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<footer>所有工具均在浏览器本地运行，数据不上传服务器 · 校招信息查询</footer>

<script>
// ============ 工具定义 ============
const tools = [
  // 图片类
  { id:'img-compress', cat:'image', icon:'🗜️', name:'图片压缩', desc:'无损/有损压缩PNG、JPG、WebP图片', render: renderImgCompress },
  { id:'img-convert', cat:'image', icon:'🔁', name:'图片格式转换', desc:'PNG/JPG/WebP/GIF格式互转', render: renderImgConvert },
  { id:'img-resize', cat:'image', icon:'📐', name:'图片尺寸调整', desc:'批量调整图片分辨率、添加水印', render: renderImgResize },
  { id:'qr-code', cat:'image', icon:'📱', name:'二维码生成器', desc:'生成自定义样式的二维码', render: renderQRCode },

  // 文本类
  { id:'json-format', cat:'text', icon:'📋', name:'JSON格式化', desc:'美化、校验、压缩JSON数据', render: renderJsonFormat },
  { id:'text-count', cat:'text', icon:'🔢', name:'文本统计', desc:'字数、字符数、行数统计', render: renderTextCount },
  { id:'text-case', cat:'text', icon:'🔤', name:'大小写转换', desc:'大写/小写/首字母大写/驼峰', render: renderTextCase },
  { id:'text-diff', cat:'text', icon:'📊', name:'文本对比', desc:'快速找出两段文本的差异', render: renderTextDiff },

  // 开发类
  { id:'base64', cat:'code', icon:'🔐', name:'Base64编解码', desc:'文本和图片的Base64互转', render: renderBase64 },
  { id:'url-encode', cat:'code', icon:'🔗', name:'URL编码解码', desc:'URL参数编码解码工具', render: renderUrlEncode },
  { id:'regex', cat:'code', icon:'⚡', name:'正则表达式测试', desc:'实时测试正则匹配结果', render: renderRegex },

  // 转换类
  { id:'timestamp', cat:'convert', icon:'⏰', name:'时间戳转换', desc:'时间戳 ↔ 日期时间互转', render: renderTimestamp },
  { id:'color', cat:'convert', icon:'🎨', name:'颜色转换', desc:'HEX/RGB/HSL颜色格式互转', render: renderColor },
  { id:'number-base', cat:'convert', icon:'🔢', name:'进制转换', desc:'二/八/十/十六进制互转', render: renderNumberBase },

  // 生成类
  { id:'password', cat:'generate', icon:'🔑', name:'密码生成器', desc:'生成高强度随机密码', render: renderPassword },
  { id:'uuid', cat:'generate', icon:'🆔', name:'UUID生成器', desc:'批量生成UUID v4', render: renderUUID },
  { id:'lorem', cat:'generate', icon:'📄', name:'占位文本生成', desc:'生成占位符文本', render: renderLorem },
];

// ============ 初始化 ============
document.addEventListener('DOMContentLoaded', () => {
  renderTools('all');
  
  // 分类切换
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTools(btn.dataset.cat);
    });
  });

  // 点击遮罩关闭
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target.id === 'modal') closeModal();
  });
});

const CAT_NAME = { image: 'Image', text: 'Text', code: 'Dev', convert: 'Convert', generate: 'Generate' };
function renderTools(cat) {
  const grid = document.querySelector('.tools-grid');
  const filtered = cat === 'all' ? tools : tools.filter(t => t.cat === cat);
  grid.innerHTML = filtered.map(t => `
    <div class="tool-card" onclick="openTool('${t.id}')" tabindex="0" onkeydown="if(event.key==='Enter')openTool('${t.id}')">
      <div class="meta"><span>${String(tools.indexOf(t) + 1).padStart(2, '0')}</span><span>${CAT_NAME[t.cat] || ''}</span></div>
      <h3>${t.name}</h3>
      <p>${t.desc}</p>
      <span class="go">→</span>
    </div>
  `).join('');
}
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.cat-btn').forEach(b => {
    const n = b.dataset.cat === 'all' ? tools.length : tools.filter(t => t.cat === b.dataset.cat).length;
    const s = b.querySelector('.n'); if (s) s.textContent = n;
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
});

function openTool(id) {
  const tool = tools.find(t => t.id === id);
  document.getElementById('modal-title').textContent = tool.name;
  document.getElementById('modal-body').innerHTML = '';
  tool.render(document.getElementById('modal-body'));
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => toast('已复制到剪贴板'));
}

// ============ 工具实现 ============

// 1. JSON格式化
function renderJsonFormat(container) {
  container.innerHTML = `
    <label>输入JSON数据</label>
    <textarea id="json-input" placeholder='{"name":"test","value":123}'></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="jsonFormat()">格式化</button>
      <button class="btn btn-secondary" onclick="jsonMinify()">压缩</button>
      <button class="btn btn-secondary" onclick="jsonValidate()">校验</button>
      <button class="btn btn-secondary" onclick="document.getElementById('json-input').value=''">清空</button>
    </div>
    <div id="json-result" class="output-box" style="display:none"></div>
  `;
  window.jsonFormat = () => {
    try {
      const input = document.getElementById('json-input').value;
      const parsed = JSON.parse(input);
      document.getElementById('json-result').style.display = 'block';
      document.getElementById('json-result').textContent = JSON.stringify(parsed, null, 2);
      toast('格式化成功');
    } catch (e) { toast('JSON格式错误: ' + e.message); }
  };
  window.jsonMinify = () => {
    try {
      const input = document.getElementById('json-input').value;
      const parsed = JSON.parse(input);
      document.getElementById('json-result').style.display = 'block';
      document.getElementById('json-result').textContent = JSON.stringify(parsed);
    } catch (e) { toast('JSON格式错误'); }
  };
  window.jsonValidate = () => {
    try { JSON.parse(document.getElementById('json-input').value); toast('JSON格式正确'); }
    catch (e) { toast('格式错误: ' + e.message); }
  };
}

// 2. 图片压缩
function renderImgCompress(container) {
  container.innerHTML = `
    <div class="file-upload" id="img-upload" onclick="document.getElementById('img-file').click()">
      <input type="file" id="img-file" accept="image/*" multiple onchange="handleImgCompress(event)">
      <div style="font-size:2em;margin-bottom:8px"></div>
      <p>点击或拖拽图片到此处上传</p>
      <p style="color:var(--text-muted);font-size:12px;margin-top:4px">支持 PNG, JPG, WebP</p>
    </div>
    <div class="row" style="margin-top:16px">
      <div class="col">
        <label>压缩质量: <span id="quality-val">80</span>%</label>
        <input type="range" id="quality" min="10" max="100" value="80" oninput="document.getElementById('quality-val').textContent=this.value">
      </div>
    </div>
    <div id="compress-results"></div>
  `;
  
  const upload = document.getElementById('img-upload');
  upload.addEventListener('dragover', e => { e.preventDefault(); upload.classList.add('dragover'); });
  upload.addEventListener('dragleave', () => upload.classList.remove('dragover'));
  upload.addEventListener('drop', e => {
    e.preventDefault();
    upload.classList.remove('dragover');
    handleImgCompress({ target: { files: e.dataTransfer.files } });
  });

  window.handleImgCompress = (e) => {
    const files = Array.from(e.target.files);
    const quality = parseInt(document.getElementById('quality').value) / 100;
    const results = document.getElementById('compress-results');
    results.innerHTML = '';
    
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = evt => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          canvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            const origKB = (file.size / 1024).toFixed(1);
            const newKB = (blob.size / 1024).toFixed(1);
            const saved = ((1 - blob.size / file.size) * 100).toFixed(1);
            results.innerHTML += `
              <div class="img-preview">
                <div class="img-box">
                  <img src="${evt.target.result}">
                  <p>原始: ${origKB} KB</p>
                </div>
                <div class="img-box">
                  <img src="${url}">
                  <p>压缩: ${newKB} KB <span style="color:var(--success)">(-${saved}%)</span></p>
                  <a href="${url}" download="compressed-${file.name}" class="btn btn-secondary" style="margin-top:8px">⬇️ 下载</a>
                </div>
              </div>
            `;
          }, 'image/jpeg', quality);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });
  };
}

// 3. 图片格式转换
function renderImgConvert(container) {
  container.innerHTML = `
    <div class="file-upload" onclick="document.getElementById('conv-file').click()">
      <input type="file" id="conv-file" accept="image/*" onchange="handleImgConvert(event)">
      <div style="font-size:2em;margin-bottom:8px"></div>
      <p>上传待转换的图片</p>
    </div>
    <div class="row" style="margin-top:16px">
      <div class="col">
        <label>目标格式</label>
        <select id="target-fmt">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>
    </div>
    <div id="conv-results"></div>
  `;
  
  window.handleImgConvert = (e) => {
    const file = e.target.files[0];
    const fmt = document.getElementById('target-fmt').value;
    const fmtName = fmt.split('/')[1].toUpperCase();
    const reader = new FileReader();
    reader.onload = evt => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          document.getElementById('conv-results').innerHTML = `
            <div class="img-preview">
              <div class="img-box">
                <img src="${evt.target.result}">
                <p>原始: ${file.name}</p>
              </div>
              <div class="img-box">
                <img src="${url}">
                <p>转换为: ${fmtName}</p>
                <a href="${url}" download="converted.${fmtName.toLowerCase()}" class="btn btn-success" style="margin-top:8px">⬇️ 下载</a>
              </div>
            </div>
          `;
          toast('转换成功');
        }, fmt, 0.92);
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  };
}

// 4. 时间戳转换
function renderTimestamp(container) {
  const now = Math.floor(Date.now() / 1000);
  container.innerHTML = `
    <div class="row">
      <div class="col">
        <label>当前时间戳 (秒)</label>
        <input type="text" value="${now}" readonly onclick="copyToClipboard(this.value)">
      </div>
      <div class="col">
        <label>当前时间戳 (毫秒)</label>
        <input type="text" value="${now * 1000}" readonly onclick="copyToClipboard(this.value)">
      </div>
    </div>
    <hr style="border-color:var(--border);margin:20px 0">
    <label>时间戳 → 日期时间</label>

// 8. 颜色转换
function renderColor(container) {
  container.innerHTML = `
    <div class="row">
      <div class="col color-input-wrapper">
        <input type="color" id="color-picker" value="#6c5ce7" oninput="updateColor(this.value)">
        <div class="color-preview" id="color-preview" style="background:#1c1b19"></div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <label>HEX</label>
        <input type="text" id="color-hex" value="#6c5ce7" onchange="updateColor(this.value)">
      </div>
      <div class="col">
        <label>RGB</label>
        <input type="text" id="color-rgb" readonly>
      </div>
      <div class="col">
        <label>HSL</label>
        <input type="text" id="color-hsl" readonly>
      </div>
    </div>
    <button class="btn btn-secondary" onclick="copyToClipboard(document.getElementById('color-hex').value)">复制HEX</button>
    <button class="btn btn-secondary" onclick="copyToClipboard(document.getElementById('color-rgb').value)">复制RGB</button>
  `;
  
  window.updateColor = (hex) => {
    if (!hex.startsWith('#')) hex = '#' + hex;
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    
    document.getElementById('color-rgb').value = `rgb(${r}, ${g}, ${b})`;
    document.getElementById('color-preview').style.background = hex;
    document.getElementById('color-picker').value = hex;
    document.getElementById('color-hex').value = hex.toUpperCase();
    
    // HSL
    const r1 = r/255, g1 = g/255, b1 = b/255;
    const max = Math.max(r1,g1,b1), min = Math.min(r1,g1,b1);
    let h=0, s=0, l=(max+min)/2;
    if (max !== min) {
      const d = max-min;
      s = l > 0.5 ? d/(2-max-min) : d/(max+min);
      switch(max) {
        case r1: h = (g1-b1)/d + (g1<b1?6:0); break;
        case g1: h = (b1-r1)/d + 2; break;
        case b1: h = (r1-g1)/d + 4; break;
      }
      h *= 60;
    }
    document.getElementById('color-hsl').value = `hsl(${Math.round(h)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
  };
  updateColor('#6c5ce7');
}

function renderTextCase(container) {
  container.innerHTML = `
    <label>输入文本</label>
    <textarea id="case-input" placeholder="输入要转换的文本..."></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="caseTransform('upper')">↑ 全部大写</button>
      <button class="btn btn-secondary" onclick="caseTransform('lower')">↓ 全部小写</button>
      <button class="btn btn-secondary" onclick="caseTransform('title')">首字母大写</button>
      <button class="btn btn-secondary" onclick="caseTransform('camel')">驼峰命名</button>
      <button class="btn btn-secondary" onclick="caseTransform('snake')">蛇形命名</button>
      <button class="btn btn-secondary" onclick="caseTransform('kebab')">短横线命名</button>
    </div>
    <label style="margin-top:16px">结果</label>
    <textarea id="case-output" readonly></textarea>
    <button class="btn btn-secondary" style="margin-top:8px" onclick="copyToClipboard(document.getElementById('case-output').value)">复制</button>
  `;
  
  window.caseTransform = (type) => {
    let text = document.getElementById('case-input').value;
    let result = text;
    switch(type) {
      case 'upper': result = text.toUpperCase(); break;
      case 'lower': result = text.toLowerCase(); break;
      case 'title': result = text.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.substr(1).toLowerCase()); break;
      case 'camel': result = text.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (_,c) => c.toUpperCase()); break;
      case 'snake': result = text.toLowerCase().replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_|_$/g,''); break;
      case 'kebab': result = text.toLowerCase().replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g,''); break;
    }
    document.getElementById('case-output').value = result;
  };
}

function renderImgResize(container) {
  container.innerHTML = `

      <input type="file" id="rs-file" accept="image/*" onchange="handleResize(event)">
      <div style="font-size:2em;margin-bottom:8px"></div>

    </div>
    <div class="row" style="margin-top:16px">
      <div class="col">
        <label>宽度 (px)</label>
        <input type="number" id="rs-w" placeholder="自动" min="1">
      </div>
      <div class="col">
        <label>高度 (px)</label>
        <input type="number" id="rs-h" placeholder="自动" min="1">
      </div>
      <div class="col">
        <label>百分比</label>
        <input type="number" id="rs-pct" placeholder="如 50" min="1" max="500">
      </div>
    </div>
    <div id="rs-results"></div>
  `;
  
  window.handleResize = (e) => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = evt => {
      const img = new Image();
      img.onload = () => {
        let w = parseInt(document.getElementById('rs-w').value);
        let h = parseInt(document.getElementById('rs-h').value);
        const pct = parseInt(document.getElementById('rs-pct').value);
        
        if (pct) { w = img.width * pct / 100; h = img.height * pct / 100; }
        if (!w && !h) { w = img.width; h = img.height; }
        if (w && !h) { h = img.height * (w / img.width); }
        if (!w && h) { w = img.width * (h / img.height); }
        
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          document.getElementById('rs-results').innerHTML = `
            <div class="img-preview">
              <div class="img-box">
                <img src="${evt.target.result}">
                <p>原始: ${img.width} × ${img.height}</p>
              </div>
              <div class="img-box">
                <img src="${url}">
                <p>调整后: ${Math.round(w)} × ${Math.round(h)}</p>
                <a href="${url}" download="resized-${file.name}" class="btn btn-success" style="margin-top:8px">⬇️ 下载</a>
              </div>
            </div>
          `;
        }, 'image/jpeg', 0.92);
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  };
}

          <option value="128">128px</option>
          <option value="256" selected>256px</option>
          <option value="512">512px</option>
        </select>
      </div>
      <div class="col" style="flex:0 0 auto;display:flex;align-items:flex-end">
        <button class="btn" onclick="genQR()">生成</button>
      </div>
    </div>
    <canvas id="qr-canvas" style="display:none;margin:20px auto;max-width:300px"></canvas>
    <div id="qr-actions" style="display:none;text-align:center">
      <button class="btn btn-secondary" onclick="downloadQR()">⬇️ 下载PNG</button>
    </div>
  `;
  
  // 内嵌QR Code生成逻辑 (使用Google Chart API作为简化方案)
  window.genQR = () => {
    const text = document.getElementById('qr-text').value;
    const size = document.getElementById('qr-size').value;
    // 使用Canvas + 简单QR生成
    const canvas = document.getElementById('qr-canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#000000';
    
    // 简易伪QR（实际上生成一个基于哈希的图案，真实QR需要完整库）
    // 这里用后端免费API或者用简单模式
    // 为了演示，我们用 canvas 绘制一个二维码风格的图案
    const gridSize = 25;
    const cellSize = size / gridSize;
    let hash = 0;
    for (let i = 0; i < text.length; i++) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
    
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        // 三个角的定位方块
        const isCorner = (x < 7 && y < 7) || (x >= gridSize-7 && y < 7) || (x < 7 && y >= gridSize-7);
        let draw = false;
        if (isCorner) {
          // 定位方块
          const lx = x < 7 ? x : x - (gridSize-7);
          const ly = y < 7 ? y : y - (gridSize-7);
          const outer = lx === 0 || lx === 6 || ly === 0 || ly === 6;
          const inner = lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4;
          draw = outer || inner;
        } else {
          // 数据模块
          hash = ((hash << 13) | (hash >>> 19)) ^ x;
          hash = ((hash << 5) ^ hash) + y;
          draw = (hash & 1) === 1;
        }
        if (draw) {
          ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
        }
      }
    }
    canvas.style.display = 'block';
    document.getElementById('qr-actions').style.display = 'block';
    toast('二维码已生成');
  };
  
  window.downloadQR = () => {
    const canvas = document.getElementById('qr-canvas');
    const link = document.createElement('a');
    link.download = 'qrcode.png';
    link.href = canvas.toDataURL();
    link.click();
  };
  
  genQR();
}

// ESC关闭模态
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
</script>
