name: Deploy to GitHub Pages

# 公开镜像站：构建静态站点并发布到 GitHub Pages。
# 每日抓取仍在私有仓库的 fetch-campus-jobs.yml 中执行（Cloudflare 正式站）；
# 本工作流每天从正式站拉取已发布的公开数据（无需 secret），重建后回写仓库。

on:
  push:
    branches: [master]
  schedule:
    # 每天 02:20 UTC（北京时间 10:20），排在正式站 01:00 UTC 更新之后
    - cron: '20 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 仅公开镜像仓库发布 Pages（私有仓库继续由 Cloudflare Pages 承载）
    if: github.repository == 'UPkZ9bC2K8MEvghe/campus-jobs-site'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 同步正式站最新数据
        if: github.event_name != 'push'
        run: node scripts/sync-public-data.mjs

      - run: npm ci

      - name: 校验并构建静态站点
        run: npm run build

      - name: 改写站点绝对地址为 GitHub Pages
        run: node scripts/rewrite-site-url.mjs
        env:
          SITE_URL: https://upkz9bc2k8mevghe.github.io/campus-jobs-site

      - name: 回写同步数据
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "chore(data): 镜像同步 $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.repository == 'UPkZ9bC2K8MEvghe/campus-jobs-site'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
