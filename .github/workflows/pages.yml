name: Deploy to GitHub Pages

# 公开镜像站：从仓库内已提交的数据构建静态站点并发布到 GitHub Pages。
# 每日抓取仍在私有仓库的 fetch-campus-jobs.yml 中执行（Cloudflare 正式站），
# 这里只负责把当前仓库的数据原样构建、发布。

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 仅公开镜像仓库发布 Pages（私有仓库继续由 Cloudflare Pages 承载）
    if: github.repository == 'UPkZ9bC2K8MEvghe/campus-jobs-site'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 校验并构建静态站点
        run: npm run build

      - name: 改写站点绝对地址为 GitHub Pages
        run: node scripts/rewrite-site-url.mjs
        env:
          SITE_URL: https://upkz9bc2k8mevghe.github.io/campus-jobs-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.repository == 'UPkZ9bC2K8MEvghe/campus-jobs-site'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
