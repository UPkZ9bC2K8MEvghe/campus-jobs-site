name: 每日抓取校招岗位

on:
  schedule:
    # 每天 09:10（北京时间）跑一次
    - cron: '10 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-campus-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 抓取企业官网岗位
        run: npm run fetch
        env:
          FETCH_ALERT_WEBHOOK: ${{ secrets.FETCH_ALERT_WEBHOOK }}

      - name: 合并进站点数据
        run: npm run merge

      - name: 数据校验
        run: npm run validate

      - name: 提交并推送数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "没有数据变化"
          else
            git commit -m "chore(data): 每日更新 $(date -u +%Y-%m-%d)"
            git push
          fi
