name: 每日更新并部署

on:
  schedule:
    # 每天 09:00（北京时间 = UTC 01:00）跑一次
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-campus-jobs
  cancel-in-progress: false

jobs:
  # 3 个分片并行抓取：每个 runner 独立起浏览器，墙钟约降为单机 1/3
  fetch:
    # 公开镜像仓库只发布静态站点，不重复执行抓取（抓取与 Cloudflare 部署仅在私有仓库运行）
    if: github.repository == 'UPkZ9bC2K8MEvghe/campus-jobs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 抓取分片 ${{ matrix.shard }}
        run: node scripts/fetch-official.mjs --shard=${{ matrix.shard }}/3
        env:
          # 分片内浏览器源并发；事件驱动等待后单源耗时大降，2 核 runner 取 6
          BROWSER_CONCURRENCY: '6'
          HTTP_CONCURRENCY: '12'

      - name: 上传分片产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            data/supplement.shard-*.json
            data/fetch-health.shard-*.json
          if-no-files-found: error
          retention-days: 1

  # 汇总：合并分片 → 同步飞书表格/文档 → 校验 → 构建 → 部署 → 回写
  deploy:
    needs: fetch
    if: github.repository == 'UPkZ9bC2K8MEvghe/campus-jobs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 下载分片产物
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: data
          merge-multiple: true

      - name: 合并分片数据
        run: node scripts/merge-shards.mjs
        env:
          FETCH_ALERT_WEBHOOK: ${{ secrets.FETCH_ALERT_WEBHOOK }}

      - name: 同步飞书多维表格与文档
        run: node scripts/export-data.mjs
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

      - name: 数据校验
        run: npm run validate

      - name: 安装 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 抓取牛客外部热榜
        run: node scripts/fetch-external-hot.mjs

      - name: 抓取智联外部覆盖校验
        run: node scripts/fetch-external-coverage.mjs

      - name: 构建站点
        run: npm run build

      - name: 提交并推送数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "没有数据变化，跳过部署"
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
          else
            git commit -m "chore(data): 每日更新 $(date -u +%Y-%m-%d)"
            git push
            echo "SKIP_DEPLOY=false" >> $GITHUB_ENV
          fi

      - name: 部署到 Cloudflare Pages
        if: env.SKIP_DEPLOY != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name campus-jobs --branch master --commit-dirty=true
